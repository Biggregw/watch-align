plugins { id 'com.android.application' }

android {
    namespace 'com.watchalign.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.watchalign.mobile.poc'
        minSdk 28
        targetSdk 35
        versionCode 13113
        versionName '1.4.0-alpha105g-arm64'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
    }

    // One fixed signing key for every build (local and CI), so Android sees the same developer each
    // time and a new build installs over the old one. The key itself is never committed: it comes from
    // WATCHALIGN_KEYSTORE_FILE + WATCHALIGN_KEYSTORE_PASSWORD (in CI, from the GitHub secrets
    // WATCHALIGN_KEYSTORE_B64 and WATCHALIGN_KEYSTORE_PASSWORD). Without them the build falls back to
    // the machine's default debug key.
    def sharedKeystore = System.getenv('WATCHALIGN_KEYSTORE_FILE')
    def sharedKeyReady = sharedKeystore && file(sharedKeystore).exists() && System.getenv('WATCHALIGN_KEYSTORE_PASSWORD')
    signingConfigs {
        if (sharedKeyReady) {
            watchalign {
                storeFile file(sharedKeystore)
                storeType 'pkcs12'
                storePassword System.getenv('WATCHALIGN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('WATCHALIGN_KEY_ALIAS') ?: 'watchalign'
                keyPassword System.getenv('WATCHALIGN_KEY_PASSWORD') ?: System.getenv('WATCHALIGN_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (sharedKeyReady) signingConfig signingConfigs.watchalign
        }
        release {
            if (sharedKeyReady) signingConfig signingConfigs.watchalign
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation 'org.opencv:opencv:4.9.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
