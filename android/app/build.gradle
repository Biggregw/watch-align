plugins { id 'com.android.application' }

android {
    namespace 'com.watchalign.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.watchalign.mobile'
        minSdk 28
        targetSdk 35
        versionCode 13054
        versionName '1.3.0-alpha54'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            // Compress native libraries inside the APK to reduce download size.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // OpenCV remains isolated behind the analysis helpers. A custom minimal native
    // OpenCV build is a later packaging optimisation; no UI/network code depends on it.
    implementation 'org.opencv:opencv:4.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
