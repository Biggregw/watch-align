plugins { id 'com.android.application' }

android {
    namespace 'com.watchalign.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.watchalign.mobile'
        minSdk 28
        targetSdk 35
        versionCode 13030
        versionName '1.3.0-alpha30'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // The OpenCV Android AAR contains native libraries for four ABIs. For the
        // sideload APK we build an arm64-only package to avoid shipping x86,
        // x86_64 and 32-bit ARM copies that the target phone can never load.
        // Keep this property opt-in so emulator/instrumentation builds still have
        // their required x86_64 OpenCV library.
        if (project.hasProperty('watchAlignArm64Only')) {
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation 'org.opencv:opencv:4.9.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
