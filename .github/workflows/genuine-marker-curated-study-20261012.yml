name: Frozen curated genuine marker study (research only)
on:
  push:
    branches: [research/genuine-marker-study-curated-20261012]
    paths:
      - .github/workflows/genuine-marker-curated-study-20261012.yml
      - tools/research/genuine_marker_curated/**
      - tools/desktop-harness/drivers/GenuineMarkerStudy.java
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: genuine-marker-curated-study-20261012
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STUDY_WORK: ${{ runner.temp }}/genuine-marker-study
      STUDY_ARTIFACT: ${{ runner.temp }}/curated-genuine-artifact
      STUDY_REPORT: docs/research/genuine-marker-curated-2026-10-12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert the frozen PR52 production tree
        run: git diff --exit-code 593966433079d04816e98f78da5b66abd1f4553d -- android/app/src/main
      - uses: actions/download-artifact@v4
        with:
          repository: Biggregw/watch-align
          run-id: '38222239457'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: WatchAlign-genuine-faceon-132-originals-Codex-ready
          path: ${{ env.STUDY_ARTIFACT }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==12.3.0
      - name: Test isolated statistics and original selection
        run: python -m unittest discover -s tools/research/genuine_marker_curated -p 'test_*.py' -v
      - name: Verify every original hash and model; resolve and select recorded watches
        run: python tools/research/genuine_marker_curated/prepare.py "$STUDY_ARTIFACT" "$STUDY_WORK" .
      - name: Run the unchanged production pipeline on selected original bytes
        run: |
          for family in gmt_126710 submariner_124060 submariner_126610; do
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$family" bash tools/desktop-harness/run.sh GenuineMarkerStudy "$STUDY_WORK/${family}_inputs.csv" "$STUDY_WORK/${family}_markers.csv" "$STUDY_WORK/no-gallery" --no-gallery
          done
      - name: Summarise individual markers and existing identity warnings
        run: python tools/research/genuine_marker_curated/summarize.py "$STUDY_WORK" "$STUDY_REPORT" . "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Render selected high mismatch and withheld comparisons from exact polygons
        run: |
          for family in gmt_126710 submariner_124060 submariner_126610; do
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$family" bash tools/desktop-harness/run.sh GenuineMarkerStudy "$STUDY_WORK/${family}_gallery_inputs.csv" "$STUDY_WORK/${family}_gallery_markers.csv" "$STUDY_WORK/gallery/$family"
          done
      - name: Verify filled-area arithmetic, input integrity and frozen production; stage derived evidence
        run: python tools/research/genuine_marker_curated/finish.py "$STUDY_WORK" "$STUDY_REPORT" .
      - name: Publish only reports and selected derived crops on this research branch
        run: |
          git add "$STUDY_REPORT"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish frozen curated genuine marker measurements [skip ci]'
          git push origin HEAD:research/genuine-marker-study-curated-20261012
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-genuine-marker-study-reports-and-outliers
          path: |
            docs/research/genuine-marker-curated-2026-10-12/
            ${{ env.STUDY_WORK }}/*markers.csv
            ${{ env.STUDY_WORK }}/*verification.json
          if-no-files-found: warn
          retention-days: 90
