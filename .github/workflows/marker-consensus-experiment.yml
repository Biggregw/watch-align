name: Projective marker-consensus experiment (calibration corpus)

# Part 8 of the marker-consensus research spec: runs the new peer-
# consensus QC layer (marker_consensus.py / marker_consensus_analysis.py)
# over the calibration-split accepted images, reusing the already-computed
# baseline ellipse/roll (same pattern as the multi-radius-homography and
# pose-library-overlay experiments). Read-only with respect to production
# pose/marker/threshold code and master geometry. Commits only the derived
# numeric CSV (no images) back to this branch; visual diagnostics (source-
# photo content) go to the artifact only. The push trigger is an explicit
# file list, never a results/output path, so the results commit cannot
# retrigger this workflow.
on:
  push:
    branches:
      - experiment/projective-marker-consensus
    paths:
      - '.github/workflows/marker-consensus-experiment.yml'
      - 'tools/watch_align_py/marker_consensus.py'
      - 'tools/watch_align_py/marker_consensus_analysis.py'
      - 'tools/watch_align_py/experiment_marker_consensus_corpus.py'
      - 'tools/watch_align_py/render_marker_consensus.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marker-consensus-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dataset fetch dependencies
        run: python -m pip install -r datasets/126710BLNR/requirements.txt

      - name: Install Watch Align Python engine dependencies
        run: python -m pip install opencv-python-headless numpy matplotlib

      - name: Fetch and normalise 126710BLNR sources (ephemeral on this runner)
        run: python datasets/126710BLNR/fetch_images.py --clean

      - name: Run marker-consensus experiment (calibration split only)
        run: |
          python tools/watch_align_py/experiment_marker_consensus_corpus.py \
            --per-image-csv datasets/126710BLNR/results/per_image_measurements.csv \
            --images-root datasets/126710BLNR \
            --out-csv datasets/126710BLNR/results/marker_consensus_experiment.csv \
            --split calibration

      - name: Render visual diagnostics (tilt spread sample)
        run: |
          python - <<'PYEOF'
          import csv, random
          from pathlib import Path
          rows = list(csv.DictReader(open("datasets/126710BLNR/results/per_image_measurements.csv", newline="", encoding="utf-8")))
          cal = [r for r in rows if r["pipeline_outcome"]=="accepted" and r["split"]=="calibration"]
          cal.sort(key=lambda r: float(r.get("tilt_deg",0) or 0))
          n = len(cal)
          idx = sorted(set([0, n//4, n//2, 3*n//4, n-1, n-2, n-3]))
          sample = [cal[i] for i in idx if 0 <= i < n]
          out_dir = Path("marker_consensus_sample_frames")
          out_dir.mkdir(exist_ok=True)
          for r in sample:
              src = Path("datasets/126710BLNR") / r["local_path"]
              if src.is_file():
                  dst = out_dir / f"{r['source_id']}__{src.name}"
                  dst.write_bytes(src.read_bytes())
          print(f"staged {len(list(out_dir.glob('*')))} sample frames")
          PYEOF
          python tools/watch_align_py/render_marker_consensus.py \
            --images-dir marker_consensus_sample_frames \
            --out-dir marker_consensus_visuals

      - name: Upload visual diagnostics artifact (renders only; no source images committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marker-consensus-visuals
          path: marker_consensus_visuals/**
          retention-days: 14
          if-no-files-found: warn

      - name: Commit derived experiment CSV (no source images)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datasets/126710BLNR/results/marker_consensus_experiment.csv
          if git diff --cached --quiet; then
            echo "no experiment changes to commit"
          else
            git commit -m "research: marker-consensus experiment run ${{ github.run_id }}

          Derived numeric diagnostics only (calibration split); no third-party
          source images are committed."
            git push origin HEAD:${{ github.ref_name }}
          fi
