name: Marker overlap research (genuine, no production changes)

on:
  push:
    branches: [feature/android-alpha106-marker-mismatch-research]
    paths:
      - '.github/workflows/marker-mismatch-research.yml'
      - 'tools/research/marker_mismatch/**'
      - 'tools/desktop-harness/drivers/MarkerMismatchBatch.java'
      - 'android/app/src/main/java/com/watchalign/mobile/MarkerPolygonMismatch.java'
      - 'android/app/src/main/java/com/watchalign/mobile/MarkerMismatchResearch.java'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  model-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: gmt_126710
            catalogue: tools/research/alpha96_calibration/catalogue_provenance_strong.csv
          - model: submariner_124060
            catalogue: tools/research/sub124060/catalogue_124060.csv
          - model: submariner_126610
            catalogue: tools/research/sub126610/catalogue_126610.csv
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q requests opencv-python-headless
      - uses: actions/cache@v4
        with:
          path: tools/desktop-harness/.cache/opencv-4.9.0-0.jar
          key: opencv-4.9.0-0-jar
      - name: Choose independent genuine watches
        run: |
          mkdir -p mismatch_out verified
          python3 tools/research/marker_mismatch/select_genuine.py "${{ matrix.catalogue }}" selected.csv --watches 75 --repeats 12
      - name: Restore byte-exact original genuine photographs
        run: |
          python3 tools/research/alpha96_calibration/fetch_verified.py selected.csv verified mismatch_out/fetch_log.csv > mismatch_out/fetch_stdout.txt
          cat mismatch_out/fetch_stdout.txt | tail -20
      - name: Measure from the production pose and detector (no new thresholds)
        env:
          JAVA_TOOL_OPTIONS: -Dwatchalign.model=${{ matrix.model }}
        run: |
          tools/desktop-harness/run.sh MarkerMismatchBatch selected.csv verified mismatch_out/per_marker.csv 2> mismatch_out/runner_stderr.log
          test -s mismatch_out/per_marker.csv
      - name: Print per-watch statistics and research-only 4pct comparison
        run: |
          python3 tools/research/marker_mismatch/summarize.py mismatch_out/per_marker.csv mismatch_out/summary.csv | tee mismatch_out/summary.txt
      - name: Save only the numbers, provenance and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marker-mismatch-${{ matrix.model }}
          path: |
            selected.csv
            mismatch_out/
          if-no-files-found: warn
          retention-days: 30
