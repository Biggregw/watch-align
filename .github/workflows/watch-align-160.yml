# Watch Align 1.6.0 clearly-off check: the app's own code (desktop harness) on the sha256-verified GENUINE photos (no
# marker may come out clearly off), and parity with the research tool (tools/research/track) on the same photos.
name: Watch Align 1.6.0 clearly-off (genuine photos, app vs research)
on:
  push:
    branches: [claude/calibration-measurement-contract-epunh5]
    paths: ['.github/workflows/watch-align-160.yml', 'android/app/src/main/java/com/watchalign/mobile/ClearlyOff.java',
            'tools/desktop-harness/drivers/TrackDump.java', 'tools/research/track/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: gmt_126710, catalogue: tools/research/alpha96_calibration/catalogue_provenance_strong.csv, prefix: '126710'}
          - {model: submariner_124060, catalogue: tools/research/sub124060/catalogue_124060.csv, prefix: '124060'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q requests numpy scipy opencv-python-headless pillow==12.3.0
      - uses: actions/cache@v4
        with: {path: tools/desktop-harness/.cache/opencv-4.9.0-0.jar, key: opencv-4.9.0-0-jar}
      - name: Verified genuine photos (sha256-checked catalogue)
        run: |
          mkdir -p g out
          python3 - <<'PY'
          import csv
          rows = [r for r in csv.DictReader(open('${{ matrix.catalogue }}'))
                  if r.get('class_label', 'gen') == 'gen' and r['model'].startswith('${{ matrix.prefix }}')]
          w = csv.DictWriter(open('g/manifest.csv', 'w', newline=''), fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          PY
          python3 tools/research/alpha96_calibration/fetch_verified.py g/manifest.csv g/img g/fetch_log.csv | tail -3
      - name: App code (desktop harness): overlay export and the clearly-off check
        run: |
          J=tools/desktop-harness/.cache/opencv-4.9.0-0.jar
          if [ ! -f "$J" ] || [ "$(stat -c %s "$J")" -lt 1000000 ]; then mkdir -p $(dirname $J); curl -fsSL -o "$J" https://repo1.maven.org/maven2/org/openpnp/opencv/4.9.0-0/opencv-4.9.0-0.jar; fi
          mkdir -p cls
          javac -encoding UTF-8 -nowarn -cp $J -sourcepath "tools/desktop-harness/shim:android/app/src/main/java" -d cls tools/desktop-harness/drivers/*.java
          java -Xmx3g -Dwatchalign.model=${{ matrix.model }} -cp $J:cls com.watchalign.mobile.OverlayDump g/manifest.csv g/img out/dump.jsonl | grep -c DUMP
          java -Xmx3g -Dwatchalign.model=${{ matrix.model }} -cp $J:cls com.watchalign.mobile.TrackDump g/manifest.csv g/img out/app.csv | grep -c TRACK
      - name: Research tool on the same photos
        env: {OMP_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1'}
        run: python3 tools/research/track/validate.py out/dump.jsonl g/img out/research.csv 4 > out/research.log
      - name: Parity and genuine answers
        run: python3 tools/research/track/parity.py out/app.csv out/research.csv | tee out/parity.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wa160-${{ matrix.model }}
          path: out/
          retention-days: 14
