# REVIEW ONLY: does each detected outer-metal outline follow the physical metal edge, and how does each marker's
# filled-template mismatch compare with the same marker on genuine watches? Unchanged pipeline, references and
# thresholds. Existing sha256-verified genuine catalogues and the nine existing QC photos only (fetch scripts already in
# the repository). Images are printed to the log of the last job only; never committed.
name: Outer-metal review
on:
  push:
    branches: [outer-metal/inspection-20261013]
    paths: ['.github/workflows/outer-metal-review.yml', 'tools/desktop-harness/drivers/OuterMetalReview.java', 'tools/desktop-harness/drivers/EdgeAngleBatch.java', 'tools/research/outer_metal/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q requests opencv-python-headless numpy
      - name: Nine QC photos (sha256-verified)
        run: python3 tools/research/alpha105g/fetch_qc.py qc_in
      - name: Numbers and review sheets
        run: |
          mkdir -p out/sheets
          for model in gmt_126710 submariner_124060; do
            [ -f "qc_in/$model/manifest.csv" ] || continue
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$model" tools/desktop-harness/run.sh MarkerMismatchBatch "qc_in/$model/manifest.csv" qc_in "out/qc_$model.csv" 2>/dev/null
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$model" tools/desktop-harness/run.sh OuterMetalReview "qc_in/$model/manifest.csv" qc_in out/sheets 2>/dev/null | grep -v '^Picked'
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$model" tools/desktop-harness/run.sh EdgeAngleBatch "qc_in/$model/manifest.csv" qc_in "out/edges_qc_$model.csv" 2>/dev/null
          done
      - uses: actions/upload-artifact@v4
        with: {name: outer-metal-qc, path: out/, retention-days: 14}
  genuine:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: gmt_126710, catalogue: tools/research/alpha96_calibration/catalogue_provenance_strong.csv, sheets: '3cf5442ab9c87b9c,a5431af6379b78a5,22075296f80ce8ce'}
          - {model: submariner_124060, catalogue: tools/research/sub124060/catalogue_124060.csv, sheets: 'd2d17532532ec40b,c14f8b3abb49c038,855041528fc1ac79'}
          - {model: submariner_126610, catalogue: tools/research/sub126610/catalogue_126610.csv, sheets: '0ee361e5864530b3,1ec6a7598b0ab7ea,e5843fa6032296bc'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q requests opencv-python-headless numpy
      - uses: actions/cache@v4
        with: {path: tools/desktop-harness/.cache/opencv-4.9.0-0.jar, key: opencv-4.9.0-0-jar}
      - name: Genuine photos (sha256-verified, existing catalogue)
        run: |
          mkdir -p img
          python3 - <<'PY'
          import csv
          rows = [r for r in csv.DictReader(open('${{ matrix.catalogue }}')) if r.get('class_label', 'gen') == 'gen']
          if False:
              rows = [r for r in rows if r['photo_id'] in '${{ matrix.sheets }}'.split(',')]
          with open('manifest.csv', 'w', newline='') as fh:
              w = csv.DictWriter(fh, fieldnames=list(rows[0].keys())); w.writeheader(); w.writerows(rows)
          print('genuine photos', len(rows))
          PY
          python3 tools/research/alpha96_calibration/fetch_verified.py manifest.csv img fetch_log.csv > /dev/null
      - name: Numbers (all genuine) and review sheets (three photos)
        env: {JAVA_TOOL_OPTIONS: '-Dwatchalign.model=${{ matrix.model }}'}
        run: |
          mkdir -p out/sheets
          tools/desktop-harness/run.sh EdgeAngleBatch manifest.csv img out/edges_genuine_${{ matrix.model }}.csv 2>/dev/null
          if [ "${{ contains(github.event.head_commit.message, '[with-area]') }}" = "true" ]; then
            tools/desktop-harness/run.sh MarkerMismatchBatch manifest.csv img out/genuine_${{ matrix.model }}.csv 2>/dev/null
            tools/desktop-harness/run.sh OuterMetalReview manifest.csv img out/sheets '${{ matrix.sheets }}' 2>/dev/null | grep -v '^Picked'
          fi
      - uses: actions/upload-artifact@v4
        with: {name: 'outer-metal-genuine-${{ matrix.model }}', path: out/, retention-days: 14}
  report:
    needs: [qc, genuine]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q pillow==12.3.0 numpy
      - uses: actions/download-artifact@v4
        with: {pattern: 'outer-metal-*', path: all, merge-multiple: true}
      - name: Images (JPEG, base64, log only)
        run: |
          python - <<'PY'
          import base64, io
          from pathlib import Path
          from PIL import Image
          files = sorted(Path('all/sheets').glob('*.png'))
          for f in files:
              im = Image.open(f).convert('RGB')
              b = io.BytesIO(); im.save(b, 'JPEG', quality=85)
              print(f'BEGIN_IMG {f.stem}.jpg'); print(base64.b64encode(b.getvalue()).decode()); print('END_IMG')
          print('IMAGES', len(files))
          PY
      - name: QC numbers (photo hour cleared mismatch)
        run: |
          python3 - <<'PY'
          import csv, glob
          for f in sorted(glob.glob('all/qc_*.csv')):
              for r in csv.DictReader(open(f)):
                  print('QCNUM', r['photo_id'], r['hour'], r['confidence'][:40], r['mismatch_pct'][:8])
          PY
      - name: Per-marker comparison with genuine
        run: python3 tools/research/outer_metal/compare.py all
      - name: Per-edge angles vs genuine (summary last)
        run: python3 tools/research/outer_metal/edge_stats.py all
