name: Build Watch Align Android Standalone

on:
  push:
    branches:
      - main
      - 'feature/android-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Static safety checks
        run: |
          grep -q 'FullscreenInspectActivity' app/src/main/AndroidManifest.xml
          grep -q 'setOverlay' app/src/main/java/com/watchalign/mobile/InspectionImageStore.java
          grep -q 'Hold to blink' app/src/main/java/com/watchalign/mobile/FullscreenInspectActivity.java
          grep -q 'setImageBitmapPreserveZoom' app/src/main/java/com/watchalign/mobile/ZoomableImageView.java
          grep -q 'Gmt126710BlnrMaster' app/src/main/java/com/watchalign/mobile/PerspectiveGmtOverlay.java
          grep -q 'CORE_VERSION' app/src/main/java/com/watchalign/mobile/WatchAlignCoreV13.java
          grep -q 'versionName' app/build.gradle
      - name: Run Android unit tests
        run: |
          bash ./gradlew :app:testDebugUnitTest --stacktrace > gradle_error.log 2>&1 || {
            echo "========== GRADLE BUILD LOG =========="
            cat gradle_error.log
            exit 1
          }
      - name: Print test result XML
        if: always()
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          if [ ${#files[@]} -gt 0 ]; then
            for f in "${files[@]}"; do
              echo "=========================================="
              echo "FILE: $f"
              echo "=========================================="
              cat "$f"
            done
          else
            echo "No test result XML files found."
          fi
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: warn
      - name: Fetch exact-model official genuine fixtures
        run: python3 fetch_genuine_fixtures.py
      - name: Validate genuine fixtures
        run: |
          test -s app/src/androidTest/assets/genuine/126710BLNR/official_00.jpg
          test -s app/src/androidTest/assets/genuine/124060/official_00.jpg
          grep -q 'rolex' app/src/androidTest/assets/genuine/126710BLNR/sources.tsv
          grep -q 'rolex' app/src/androidTest/assets/genuine/124060/sources.tsv
          echo 'Official genuine fixtures prepared.'
      - name: Build standalone APK
        run: bash ./gradlew :app:assembleDebug --stacktrace
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep "versionName" app/build.gradle | sed -E "s/.*versionName '([^']+)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare working APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "WatchAlign-Android-${{ steps.version.outputs.version }}.apk"
          sha256sum "WatchAlign-Android-${{ steps.version.outputs.version }}.apk" > SHA256SUMS-Android.txt
      - name: Upload working APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-Android-${{ steps.version.outputs.version }}
          path: |
            android/WatchAlign-Android-${{ steps.version.outputs.version }}.apk
            android/SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 30
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "Watch Align Android v${{ steps.version.outputs.version }}"
          body: "Official standalone build for Watch Align Android v${{ steps.version.outputs.version }}."
          files: |
            android/WatchAlign-Android-${{ steps.version.outputs.version }}.apk
            android/SHA256SUMS-Android.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  genuine-image-instrumentation:
    needs: build-android
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Fetch exact-model official genuine fixtures
        run: python3 fetch_genuine_fixtures.py
      - name: Validate genuine fixtures
        run: |
          test -s app/src/androidTest/assets/genuine/126710BLNR/official_00.jpg
          test -s app/src/androidTest/assets/genuine/124060/official_00.jpg
          grep -q 'rolex' app/src/androidTest/assets/genuine/126710BLNR/sources.tsv
          grep -q 'rolex' app/src/androidTest/assets/genuine/124060/sources.tsv
      - name: Set up Python (emulator photo run)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch photos for the emulator photo run
        continue-on-error: true
        shell: bash
        working-directory: .
        run: |
          python -m pip install -q -r datasets/126710BLNR/requirements.txt
          python datasets/126710BLNR/fetch_images.py --clean \
            --source gen_wex_3KSuGhC --source gen_wex_1TDYtpN --source gen_wex_e99gXKb \
            --source rep_vsf_7s6PyXJ --source rep_vsf_p3hHVMB --source rep_cf_bpdi5xV --source rep_cf_6I00d8w || true
          D=android/app/src/androidTest/assets/e2e; mkdir -p "$D"
          cp android/app/src/androidTest/assets/genuine/126710BLNR/official_00.jpg "$D/gen_official_render.jpg" || true
          for f in gen/calibration/gen_wex_3KSuGhC/image_00 gen/calibration/gen_wex_3KSuGhC/image_02 gen/calibration/gen_wex_3KSuGhC/image_04 \
                   gen/validation/gen_wex_1TDYtpN/image_01 gen/validation/gen_wex_1TDYtpN/image_05 gen/calibration/gen_wex_e99gXKb/image_08 \
                   rep/validation/rep_vsf_7s6PyXJ/image_02 rep/validation/rep_vsf_p3hHVMB/image_00 rep/calibration/rep_cf_bpdi5xV/image_00 \
                   rep/calibration/rep_cf_6I00d8w/image_01; do
            src="datasets/126710BLNR/$f.jpg"; [ -s "$src" ] && cp "$src" "$D/$(basename $(dirname $f))_$(basename $f).jpg"
          done
          # Genuine 126710BLRO (Pepsi) auction photos from Phillips: studio shots that exposed
          # the dial-centre rotation bias fixed in alpha58.
          for id in CH080218/1 HK080220/821 NY080120/2 CH080120/75; do
            curl -sSfL -A 'Mozilla/5.0' -o "$D/gen_BLRO_phillips_$(echo $id | tr / _).jpg" "https://dist.phillips.com/auction-assets/${id}_001.jpg?width=2400" || true
          done
          ls -la "$D"
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run genuine-image Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd android && bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.watchalign.mobile.GenuineOfficialImageValidationTest,com.watchalign.mobile.EmulatorPhotoRunTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace; echo $? > /tmp/connected_exit
            mkdir -p android/e2e-out && adb exec-out run-as com.watchalign.mobile tar cf - files/e2e > android/e2e-out/e2e.tar; tar xf android/e2e-out/e2e.tar -C android/e2e-out || true
            cat android/e2e-out/files/e2e/summaries.txt || true
            exit $(cat /tmp/connected_exit)
      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-image-instrumentation-results
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload emulator photo run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-photo-run
          path: android/e2e-out/
          if-no-files-found: warn
          retention-days: 14
