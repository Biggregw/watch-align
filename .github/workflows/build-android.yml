name: Build Watch Align Android Standalone

on:
  push:
    branches:
      - feature/android-offline-v1.3.0-alpha
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Static safety checks
        run: |
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'exact-v4' app/src/main/java/com/watchalign/mobile/OnlineReferenceFinder.java
          grep -q 'WatchAlignCoreV10' app/src/main/java/com/watchalign/mobile/MainActivity.java
          grep -q 'WatchAlignCoreV7.analyse(watch,null,modelRef)' app/src/main/java/com/watchalign/mobile/WatchAlignCoreV10.java
          grep -q 'SimilarityTransform.between' app/src/main/java/com/watchalign/mobile/GeometryOverlayRepair.java
          grep -q 'srcGlobalAngle - refGlobalAngle' app/src/main/java/com/watchalign/mobile/GeometryRegistration.java
          grep -q '1.3.0-alpha10' app/src/main/java/com/watchalign/mobile/MainActivity.java
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build standalone APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WatchAlign-Android-1.3.0-alpha10.apk
          sha256sum WatchAlign-Android-1.3.0-alpha10.apk > SHA256SUMS-Android.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-Android-1.3.0-alpha10
          path: android/WatchAlign-Android-1.3.0-alpha10.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish Android alpha10 release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='android-v1.3.0-alpha10'
          git fetch --tags
          if git tag -l "$tag" | grep -q .; then
            echo "Release tag already exists; skipping publication"
            exit 0
          fi
          gh release create "$tag" WatchAlign-Android-1.3.0-alpha10.apk SHA256SUMS-Android.txt \
            --target "$GITHUB_SHA" \
            --title 'Watch Align Android 1.3.0-alpha10' \
            --prerelease \
            --notes 'Android alpha10 removes the retired V7 raster registration path from reference comparisons entirely. V7 is now used only for QC detection/measurement; overlays are generated solely by the deterministic geometry transform. Transform tests now cover centre mapping, scale, distance preservation, positive/negative OpenCV rotation direction, combined scale/rotation/translation, matrix equivalence and invalid inputs. Exact-model reference and geometry-registration tests remain mandatory before APK publication.'
