name: Build Watch Align Android Standalone

on:
  push:
    branches:
      - main
      - feature/android-offline-v1.3.0-alpha
      - feature/android-alpha15-cyclops-model-catalog
      - feature/android-alpha16-date-magnification
      - feature/android-alpha17-genuine-validation
      - feature/android-alpha18-reliability-fixes
      - feature/android-alpha19-genuine-baseline
      - feature/android-alpha20-gen-distribution
      - feature/android-alpha21-canonical-gmt-geometry
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Static safety checks
        run: |
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'pool-v1' app/src/main/java/com/watchalign/mobile/OnlineReferenceFinder.java
          grep -q 'findPool' app/src/main/java/com/watchalign/mobile/MainActivity.java
          grep -q 'CanonicalGmtGeometryAnalyzer' app/src/main/java/com/watchalign/mobile/WatchAlignCoreV13.java
          grep -q 'marker ring is not used as the radial datum' app/src/main/java/com/watchalign/mobile/CanonicalGmtGeometryAnalyzer.java
          grep -q 'radialPctDial' app/src/main/java/com/watchalign/mobile/CanonicalGmtGeometryAnalyzer.java
          grep -q 'CanonicalGmtGeometryAnalyzerTest' app/src/test/java/com/watchalign/mobile/CanonicalGmtGeometryAnalyzerTest.java
          grep -q 'GenuineBaselineStats' app/src/main/java/com/watchalign/mobile/ReferenceDistributionAnalyzer.java
          grep -q 'ZoomableImageView' app/src/main/java/com/watchalign/mobile/MainActivity.java
          grep -q 'QcGuideRenderer.render' app/src/main/java/com/watchalign/mobile/WatchAlignCoreV13.java
          grep -q 'QcSummaryFormatter.prependSummary' app/src/main/java/com/watchalign/mobile/WatchAlignCoreV13.java
          grep -q 'GenuineOfficialImageValidationTest' app/src/androidTest/java/com/watchalign/mobile/GenuineOfficialImageValidationTest.java
          grep -q 'CARTIER-SANTOS-M' app/src/main/java/com/watchalign/mobile/ModelCatalog.java
          grep -q 'SimilarityTransform.between' app/src/main/java/com/watchalign/mobile/GeometryOverlayRepair.java
          grep -q 'srcGlobalAngle - refGlobalAngle' app/src/main/java/com/watchalign/mobile/GeometryRegistration.java
          grep -q '1.3.0-alpha21' app/src/main/java/com/watchalign/mobile/MainActivity.java
          grep -q '1.3.0-alpha21' app/src/main/java/com/watchalign/mobile/WatchAlignCoreV13.java
          grep -q "versionCode 13021" app/build.gradle
          grep -q "versionName '1.3.0-alpha21'" app/build.gradle
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Fetch exact-model official genuine fixtures
        run: python3 fetch_genuine_fixtures.py
      - name: Validate genuine fixtures
        run: |
          test -s app/src/androidTest/assets/genuine/126710BLNR/official_00.jpg
          test -s app/src/androidTest/assets/genuine/124060/official_00.jpg
          grep -q 'rolex' app/src/androidTest/assets/genuine/126710BLNR/sources.tsv
          grep -q 'rolex' app/src/androidTest/assets/genuine/124060/sources.tsv
          echo 'Official genuine fixtures prepared.'
      - name: Build standalone APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare working APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WatchAlign-Android-1.3.0-alpha21.apk
          sha256sum WatchAlign-Android-1.3.0-alpha21.apk > SHA256SUMS-Android.txt
      - name: Upload working APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-Android-1.3.0-alpha21
          path: |
            android/WatchAlign-Android-1.3.0-alpha21.apk
            android/SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 30
