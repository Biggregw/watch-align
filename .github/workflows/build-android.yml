name: Build Watch Align Android Standalone

on:
  push:
    branches:
      - main
      - feature/android-offline-v1.3.0-alpha
      - feature/android-alpha15-cyclops-model-catalog
      - feature/android-alpha16-date-magnification
      - feature/android-alpha17-genuine-validation
      - feature/android-alpha18-reliability-fixes
      - feature/android-alpha19-genuine-baseline
      - feature/android-alpha20-gen-distribution
      - feature/android-alpha21-canonical-gmt-geometry
      - feature/android-alpha22-perspective-overlay
      - feature/android-alpha23-zoom-fix
      - feature/android-alpha24-stabilisation
      - feature/android-alpha25-fullscreen-inspector
      - feature/android-alpha26-fixed-gmt-master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Static safety checks
        run: |
          grep -q 'FullscreenInspectActivity' app/src/main/AndroidManifest.xml
          grep -q 'InspectionImageStore' app/src/main/java/com/watchalign/mobile/MainActivity.java
          grep -q 'Dedicated non-scrolling image inspector' app/src/main/java/com/watchalign/mobile/FullscreenInspectActivity.java
          grep -q 'ScaleGestureDetector owns pinch state' app/src/main/java/com/watchalign/mobile/ZoomableImageView.java
          grep -q 'Gmt126710BlnrMaster' app/src/main/java/com/watchalign/mobile/PerspectiveGmtOverlay.java
          grep -q '126710BLNR-master-v1' app/src/main/java/com/watchalign/mobile/Gmt126710BlnrMaster.java
          test -s app/src/main/assets/templates/126710BLNR-master-v1.json
          grep -q '1.3.0-alpha26' app/src/main/java/com/watchalign/mobile/MainActivity.java
          grep -q '1.3.0-alpha26' app/src/main/java/com/watchalign/mobile/WatchAlignCoreV13.java
          grep -q "versionCode 13026" app/build.gradle
          grep -q "versionName '1.3.0-alpha26'" app/build.gradle
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Fetch exact-model official genuine fixtures
        run: python3 fetch_genuine_fixtures.py
      - name: Validate genuine fixtures
        run: |
          test -s app/src/androidTest/assets/genuine/126710BLNR/official_00.jpg
          test -s app/src/androidTest/assets/genuine/124060/official_00.jpg
          grep -q 'rolex' app/src/androidTest/assets/genuine/126710BLNR/sources.tsv
          grep -q 'rolex' app/src/androidTest/assets/genuine/124060/sources.tsv
          echo 'Official genuine fixtures prepared.'
      - name: Build standalone APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare working APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WatchAlign-Android-1.3.0-alpha26.apk
          sha256sum WatchAlign-Android-1.3.0-alpha26.apk > SHA256SUMS-Android.txt
      - name: Upload working APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-Android-1.3.0-alpha26
          path: |
            android/WatchAlign-Android-1.3.0-alpha26.apk
            android/SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 30
