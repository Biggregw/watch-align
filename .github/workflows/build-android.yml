name: Build Watch Align Android Standalone

on:
  push:
    branches:
      - main
      - feature/android-offline-v1.3.0-alpha
      - feature/android-alpha15-cyclops-model-catalog
      - feature/android-alpha16-date-magnification
      - feature/android-alpha17-genuine-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Static safety checks
        run: |
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'exact-v6' app/src/main/java/com/watchalign/mobile/OnlineReferenceFinder.java
          grep -q 'WatchAlignCoreV13' app/src/main/java/com/watchalign/mobile/MainActivity.java
          grep -q 'ZoomableImageView' app/src/main/java/com/watchalign/mobile/MainActivity.java
          grep -q 'QcGuideRenderer.render' app/src/main/java/com/watchalign/mobile/WatchAlignCoreV13.java
          grep -q 'QcExtendedAnalyzer.analyse(watch,reference,modelRef)' app/src/main/java/com/watchalign/mobile/WatchAlignCoreV13.java
          grep -q 'QcSummaryFormatter.prependSummary' app/src/main/java/com/watchalign/mobile/WatchAlignCoreV13.java
          grep -q 'marker vs minute track' app/src/main/java/com/watchalign/mobile/QcExtendedAnalyzer.java
          grep -q 'Top QC findings' app/src/main/java/com/watchalign/mobile/QcExtendedAnalyzer.java
          grep -q 'perspective could not be verified from this photo' app/src/main/java/com/watchalign/mobile/QcExtendedMath.java
          grep -q 'Date aperture vs local' app/src/main/java/com/watchalign/mobile/QcExtendedAnalyzer.java
          grep -q 'Apparent date numeral magnification vs genuine' app/src/main/java/com/watchalign/mobile/QcExtendedAnalyzer.java
          grep -q 'Cyclops vs date aperture' app/src/main/java/com/watchalign/mobile/QcExtendedAnalyzer.java
          grep -q 'minuteIndexForHour' app/src/main/java/com/watchalign/mobile/QcExtendedMath.java
          grep -q 'GenuineOfficialImageValidationTest' app/src/androidTest/java/com/watchalign/mobile/GenuineOfficialImageValidationTest.java
          grep -q 'CARTIER-SANTOS-M' app/src/main/java/com/watchalign/mobile/ModelCatalog.java
          grep -q 'SimilarityTransform.between' app/src/main/java/com/watchalign/mobile/GeometryOverlayRepair.java
          grep -q 'srcGlobalAngle - refGlobalAngle' app/src/main/java/com/watchalign/mobile/GeometryRegistration.java
          grep -q '1.3.0-alpha17' app/src/main/java/com/watchalign/mobile/MainActivity.java
          grep -q '1.3.0-alpha17' app/src/main/java/com/watchalign/mobile/WatchAlignCoreV13.java
          grep -q "versionCode 13017" app/build.gradle
          grep -q "versionName '1.3.0-alpha17'" app/build.gradle
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Fetch exact-model official genuine fixtures
        run: python3 fetch_genuine_fixtures.py
      - name: Run official genuine-image acceptance tests
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Build standalone APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare working APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WatchAlign-Android-1.3.0-alpha17.apk
          sha256sum WatchAlign-Android-1.3.0-alpha17.apk > SHA256SUMS-Android.txt
      - name: Upload working APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-Android-1.3.0-alpha17
          path: |
            android/WatchAlign-Android-1.3.0-alpha17.apk
            android/SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 30
