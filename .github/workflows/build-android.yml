name: Build Watch Align Android Offline

on:
  push:
    branches:
      - feature/android-offline-v1.3.0-alpha
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build offline APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify no INTERNET permission is declared
        run: |
          if grep -R "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "Offline APK must not request INTERNET"; exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-Android-1.3.0-alpha1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
