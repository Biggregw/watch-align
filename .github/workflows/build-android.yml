name: Build Watch Align Android Standalone

on:
  push:
    branches:
      - main
      - 'feature/android-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Static safety checks
        run: |
          grep -q 'FullscreenInspectActivity' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'setOverlay' app/src/main/java/com/watchalign/mobile/InspectionImageStore.java
          grep -q 'Hold to blink' app/src/main/java/com/watchalign/mobile/FullscreenInspectActivity.java
          grep -q 'setImageBitmapPreserveZoom' app/src/main/java/com/watchalign/mobile/ZoomableImageView.java
          grep -q 'Community-style index alignment ruler' app/src/main/java/com/watchalign/mobile/PerspectiveMasterRenderer.java
          grep -q 'CORE_VERSION="1.3.0"' app/src/main/java/com/watchalign/mobile/WatchAlignCore.java
          grep -q 'WatchAlignCore.AnalysisResult' app/src/main/java/com/watchalign/mobile/MainActivity.java
          ! grep -R -q 'java.lang.reflect' app/src/main/java
          ! find app/src/main/java -name 'WatchAlignCoreV*.java' | grep -q .
          test ! -e app/src/main/java/com/watchalign/mobile/OnlineReferenceFinder.java
          grep -q "abiFilters 'arm64-v8a'" app/build.gradle
          grep -q "versionName '1.3.0-rc1'" app/build.gradle
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build standalone APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build release AAB path
        run: gradle :app:bundleRelease --stacktrace
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep "versionName" app/build.gradle | sed -E "s/.*versionName '([^']+)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare working APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "WatchAlign-Android-${{ steps.version.outputs.version }}.apk"
          sha256sum "WatchAlign-Android-${{ steps.version.outputs.version }}.apk" > SHA256SUMS-Android.txt
          ls -lh "WatchAlign-Android-${{ steps.version.outputs.version }}.apk"
          APK_BYTES=$(stat -c %s "WatchAlign-Android-${{ steps.version.outputs.version }}.apk")
          AAB_BYTES=$(stat -c %s app/build/outputs/bundle/release/app-release.aab)
          echo "### Android package sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "* arm64 debug APK: ${APK_BYTES} bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "* release AAB: ${AAB_BYTES} bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload working APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-Android-${{ steps.version.outputs.version }}
          path: |
            android/WatchAlign-Android-${{ steps.version.outputs.version }}.apk
            android/SHA256SUMS-Android.txt
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
