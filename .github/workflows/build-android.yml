name: Build Watch Align Android Standalone

on:
  push:
    branches:
      - feature/android-offline-v1.3.0-alpha
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Static safety checks
        run: |
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'exact-v3' app/src/main/java/com/watchalign/mobile/OnlineReferenceFinder.java
          grep -q 'MIN_OVERLAY_ECC = 0.60' app/src/main/java/com/watchalign/mobile/WatchAlignCore.java
          grep -q 'refineInnerDial' app/src/main/java/com/watchalign/mobile/WatchAlignCore.java
          grep -q 'sampleBoundaryContrast' app/src/main/java/com/watchalign/mobile/WatchAlignCore.java
          grep -q '1.3.0-alpha6' app/src/main/java/com/watchalign/mobile/MainActivity.java
      - name: Build standalone APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WatchAlign-Android-1.3.0-alpha6.apk
          sha256sum WatchAlign-Android-1.3.0-alpha6.apk > SHA256SUMS-Android.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-Android-1.3.0-alpha6
          path: android/WatchAlign-Android-1.3.0-alpha6.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish Android alpha6 release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='android-v1.3.0-alpha6'
          git fetch --tags
          if git tag -l "$tag" | grep -q .; then
            echo "Release tag already exists; skipping publication"
            exit 0
          fi
          gh release create "$tag" WatchAlign-Android-1.3.0-alpha6.apk SHA256SUMS-Android.txt \
            --target "$GITHUB_SHA" \
            --title 'Watch Align Android 1.3.0-alpha6' \
            --prerelease \
            --notes 'Standalone Android alpha6. Refines the hybrid detector so a strong outer bezel candidate is searched concentrically inward for the true black-dial boundary. Candidate scoring now adds annulus darkness and signed inside-vs-outside boundary contrast, and marker evidence requires a bright marker with darker dial immediately inward. The inner boundary only replaces the outer candidate when it is materially stronger, substantially smaller, and nearly as confident. Overlay safety gates remain unchanged.'
