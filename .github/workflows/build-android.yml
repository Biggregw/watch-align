name: Build Watch Align Android Standalone

on:
  push:
    branches:
      - feature/android-offline-v1.3.0-alpha
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build standalone APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify INTERNET permission for direct reference discovery
        run: grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml
      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WatchAlign-Android-1.3.0-alpha2.apk
          sha256sum WatchAlign-Android-1.3.0-alpha2.apk > SHA256SUMS-Android.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-Android-1.3.0-alpha2
          path: android/WatchAlign-Android-1.3.0-alpha2.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish Android alpha2 release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='android-v1.3.0-alpha2'
          git fetch --tags
          if git tag -l "$tag" | grep -q .; then
            echo "Release tag already exists; skipping publication"
            exit 0
          fi
          gh release create "$tag" WatchAlign-Android-1.3.0-alpha2.apk SHA256SUMS-Android.txt \
            --target "$GITHUB_SHA" \
            --title 'Watch Align Android 1.3.0-alpha2' \
            --prerelease \
            --notes 'Standalone Android alpha with no hosted backend. Analysis remains on-device. When no manual reference is supplied, the app connects directly to official manufacturer pages, downloads candidate references, scores them for geometric similarity, selects the best usable match, and caches it locally. Overlay registration now adds constrained rotation/translation refinement after circle pre-alignment.'
