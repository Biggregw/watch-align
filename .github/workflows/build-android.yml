name: Build Watch Align Android Standalone

on:
  push:
    branches:
      - main
      - 'feature/android-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Static safety checks
        run: |
          grep -q 'FullscreenInspectActivity' app/src/main/AndroidManifest.xml
          grep -q 'setOverlay' app/src/main/java/com/watchalign/mobile/InspectionImageStore.java
          grep -q 'Hold to blink' app/src/main/java/com/watchalign/mobile/FullscreenInspectActivity.java
          grep -q 'setImageBitmapPreserveZoom' app/src/main/java/com/watchalign/mobile/ZoomableImageView.java
          grep -q 'Gmt126710BlnrMaster' app/src/main/java/com/watchalign/mobile/PerspectiveGmtOverlay.java
          grep -q 'CORE_VERSION' app/src/main/java/com/watchalign/mobile/WatchAlignCoreV13.java
          grep -q 'versionName' app/build.gradle
      - name: Run Android unit tests
        run: |
          bash ./gradlew :app:testDebugUnitTest --stacktrace > gradle_error.log 2>&1 || {
            echo "========== GRADLE BUILD LOG =========="
            cat gradle_error.log
            exit 1
          }
      - name: Print test result XML
        if: always()
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          if [ ${#files[@]} -gt 0 ]; then
            for f in "${files[@]}"; do
              echo "=========================================="
              echo "FILE: $f"
              echo "=========================================="
              cat "$f"
            done
          else
            echo "No test result XML files found."
          fi
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: warn
      - name: Fetch exact-model official genuine fixtures
        run: python3 fetch_genuine_fixtures.py
      - name: Validate genuine fixtures
        run: |
          test -s app/src/androidTest/assets/genuine/126710BLNR/official_00.jpg
          test -s app/src/androidTest/assets/genuine/124060/official_00.jpg
          grep -q 'rolex' app/src/androidTest/assets/genuine/126710BLNR/sources.tsv
          grep -q 'rolex' app/src/androidTest/assets/genuine/124060/sources.tsv
          echo 'Official genuine fixtures prepared.'
      - name: Build standalone arm64 APK
        run: bash ./gradlew :app:assembleDebug -PwatchAlignArm64Only --stacktrace
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep "versionName" app/build.gradle | sed -E "s/.*versionName '([^']+)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare working APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "WatchAlign-Android-${{ steps.version.outputs.version }}-arm64.apk"
          sha256sum "WatchAlign-Android-${{ steps.version.outputs.version }}-arm64.apk" > SHA256SUMS-Android.txt
      - name: Upload working APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-Android-${{ steps.version.outputs.version }}-arm64
          path: |
            android/WatchAlign-Android-${{ steps.version.outputs.version }}-arm64.apk
            android/SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 30
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "Watch Align Android v${{ steps.version.outputs.version }}"
          body: "Official standalone arm64 build for Watch Align Android v${{ steps.version.outputs.version }}."
          files: |
            android/WatchAlign-Android-${{ steps.version.outputs.version }}-arm64.apk
            android/SHA256SUMS-Android.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manual test build
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        with:
          tag_name: "dev-${{ github.ref_name }}"
          name: "Watch Align Android dev build (${{ github.ref_name }})"
          body: "Manual test build from commit ${{ github.sha }}. Not an official release -- overwritten each time this workflow is manually run from this branch. For phone-friendly sideloading only."
          prerelease: true
          files: |
            android/WatchAlign-Android-${{ steps.version.outputs.version }}-arm64.apk
            android/SHA256SUMS-Android.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  genuine-image-instrumentation:
    needs: build-android
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Fetch exact-model official genuine fixtures
        run: python3 fetch_genuine_fixtures.py
      - name: Validate genuine fixtures
        run: |
          test -s app/src/androidTest/assets/genuine/126710BLNR/official_00.jpg
          test -s app/src/androidTest/assets/genuine/124060/official_00.jpg
          grep -q 'rolex' app/src/androidTest/assets/genuine/126710BLNR/sources.tsv
          grep -q 'rolex' app/src/androidTest/assets/genuine/124060/sources.tsv
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run genuine-image Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd android && bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.watchalign.mobile.GenuineOfficialImageValidationTest --stacktrace
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.watchalign.mobile.OfficialMarkerCalibrationTest com.watchalign.mobile.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee marker_calibration_instrument_output.txt
            grep -q "OK (1 test)" marker_calibration_instrument_output.txt
            mkdir -p marker-calibration-output
            adb pull /sdcard/Android/data/com.watchalign.mobile/files/marker-calibration/. marker-calibration-output/
            echo '--- official first-party 126710BLNR marker calibration report ---'
            cat marker-calibration-output/official-126710blnr-marker-report.tsv
      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-image-instrumentation-results
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
            marker-calibration-output/
          if-no-files-found: warn
          retention-days: 14
