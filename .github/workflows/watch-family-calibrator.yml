name: Watch family calibrator

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Exact watch reference configured under calibration/models"
        required: true
        default: "124060"
      fresh:
        description: "Discard this model's cached calibration workspace and discover again"
        type: boolean
        default: true
  pull_request:
    paths:
      # The harness measures through the app's own Java sources, so app changes re-run calibration.
      - 'android/app/src/main/java/**'
      - 'tools/watch_calibrator/**'
      - 'tools/desktop-harness/drivers/**'
      - 'tools/desktop-harness/run.sh'
      - 'tools/dataset_harvester/submariner_acquire.py'
      - 'calibration/models/**'
      - '.github/workflows/watch-family-calibrator.yml'
  push:
    branches:
      - feature/watch-family-calibrator
    paths:
      - 'tools/watch_calibrator/**'
      - 'tools/desktop-harness/drivers/**'
      - 'tools/desktop-harness/run.sh'
      - 'calibration/models/**'
      - '.github/workflows/watch-family-calibrator.yml'

permissions:
  contents: read

concurrency:
  group: watch-family-calibrator-${{ github.ref }}-${{ github.event.inputs.model || '124060' }}
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        # Explicit bash runs with -eo pipefail, so `cmd | tee log` fails when cmd fails.
        shell: bash
    env:
      IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      MODEL: ${{ github.event.inputs.model || '124060' }}
      WATCH_ALIGN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WATCH_ALIGN_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python dependencies
        run: python -m pip install -q -r tools/dataset_harvester/requirements.txt
      - name: Install Android platform for shared detector compilation
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pure calibrator tests
        run: python -m unittest discover -s tools/watch_calibrator/tests -v
      - name: Existing harvester/research regression tests
        run: python -m unittest discover -s tools/dataset_harvester/tests -v
      - name: Restore OpenCV desktop-harness jar
        uses: actions/cache@v4
        with:
          path: tools/desktop-harness/.cache/opencv-4.9.0-0.jar
          key: opencv-4.9.0-0-jar
      - name: Restore autonomous image cache
        uses: actions/cache@v4
        with:
          path: datasets/watch_calibrator/${{ env.MODEL }}/dataset/images
          key: watch-calibrator-${{ env.MODEL }}-images-${{ github.run_id }}
          restore-keys: |
            watch-calibrator-${{ env.MODEL }}-images-
            submariner-research-images-
      - name: End-to-end autonomous discovery, snapshot, legacy measurement and calibration
        run: |
          fresh=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.fresh }}" = "true" ]; then fresh="--fresh"; fi
          python3 tools/watch_calibrator/run.py "$MODEL" $fresh | tee watch-calibrator.log
      - name: Replay same frozen evidence through measured-only adapter with no network
        env:
          # Replay never needs acquisition credentials, and the harness must not fetch tooling.
          IMGUR_CLIENT_ID: ''
          REDDIT_CLIENT_ID: ''
          REDDIT_CLIENT_SECRET: ''
          WATCH_ALIGN_HARNESS_OFFLINE: '1'
        run: |
          SNAP="datasets/watch_calibrator/$MODEL/evidence_snapshot_v1"
          # Root is used only to create an empty network namespace. setpriv immediately drops back to
          # this runner user (real, effective and saved ids), and env -i restores this step's exact,
          # credential-free environment, which sudo would otherwise reset. No kernel or AppArmor
          # setting is changed. The probe must prove isolation inside that namespace first.
          mapfile -d '' -t STEP_ENV < <(env -0)
          sudo unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- \
            env -i "${STEP_ENV[@]}" \
            bash -eo pipefail -c '
              [ "$(id -u):$(id -g)" = "$2" ] || { echo "replay is not running as the runner user" >&2; exit 1; }
              python3 tools/watch_calibrator/network_isolation.py
              python3 tools/watch_calibrator/replay.py "$1" --root datasets/watch_calibrator_replay --fresh --measurement-adapter submariner12_measured_v1
            ' replay "$SNAP" "$(id -u):$(id -g)" | tee watch-calibrator-replay.log
      - name: Require exact calibration equivalence
        run: cmp "datasets/watch_calibrator/$MODEL/calibration.json" "datasets/watch_calibrator_replay/$MODEL/calibration.json"
      - name: Require the frozen-evidence calibration bytes
        run: |
          # On the frozen evidence snapshot proven before measurement contract v2, live calibration
          # through this build must reproduce the checkpoint calibration exactly.
          SNAP_ID=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['snapshot_id'])" "datasets/watch_calibrator/$MODEL/evidence_snapshot_v1/snapshot.json")
          SHA=$(sha256sum "datasets/watch_calibrator/$MODEL/calibration.json" | cut -d' ' -f1)
          echo "snapshot $SNAP_ID calibration.json sha256 $SHA"
          case "$SNAP_ID" in
            ca23588a*) [ "$SHA" = 3ae71e98a533be4e87cbdfc48b0d893118ebe2c6d761eeb34ca981a90fb2b796 ] || { echo "calibration bytes changed on the frozen snapshot" >&2; exit 1; } ;;
            *) echo "::warning::snapshot $SNAP_ID is not the frozen v1 proof snapshot; only live/replay equality is checked" ;;
          esac
      - name: Verify replay evidence, adapter and contract identity
        run: |
          python3 tools/watch_calibrator/replay_acceptance.py \
            --live "datasets/watch_calibrator/$MODEL" \
            --replay "datasets/watch_calibrator_replay/$MODEL" \
            --live-adapter production_app_route_v1 \
            --replay-adapter submariner12_measured_v1 \
            --out "datasets/watch_calibrator_replay/$MODEL/replay_acceptance.json"
      - name: Prove v1/v2 measurement-contract equivalence on frozen evidence
        env:
          IMGUR_CLIENT_ID: ''
          REDDIT_CLIENT_ID: ''
          REDDIT_CLIENT_SECRET: ''
          WATCH_ALIGN_HARNESS_OFFLINE: '1'
        run: |
          SNAP="datasets/watch_calibrator/$MODEL/evidence_snapshot_v1"
          OUT="datasets/watch_calibrator_replay/$MODEL/geometry/phase2c_equivalence.json"
          mapfile -d '' -t STEP_ENV < <(env -0)
          sudo unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- \
            env -i "${STEP_ENV[@]}" \
            bash -eo pipefail -c '
              [ "$(id -u):$(id -g)" = "$3" ] || { echo "Phase 2C proof is not running as the runner user" >&2; exit 1; }
              python3 tools/watch_calibrator/network_isolation.py
              python3 tools/watch_calibrator/phase2c_equivalence.py "$1" --replay-root datasets/watch_calibrator_replay --out "$2"
            ' phase2c "$SNAP" "$OUT" "$(id -u):$(id -g)" | tee watch-calibrator-phase2c.log
          echo '### Phase 2C v1/v2 equivalence' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Build Phase 3 calibration outcomes and coverage funnel
        env:
          IMGUR_CLIENT_ID: ''
          REDDIT_CLIENT_ID: ''
          REDDIT_CLIENT_SECRET: ''
          WATCH_ALIGN_HARNESS_OFFLINE: '1'
        run: |
          SNAP="datasets/watch_calibrator/$MODEL/evidence_snapshot_v1"
          GEO="datasets/watch_calibrator_replay/$MODEL/geometry"
          SUMMARY="$GEO/phase3_reporting_summary.json"
          CAND="datasets/watch_calibrator/$MODEL/dataset/candidate_summary.csv"
          python3 tools/watch_calibrator/phase3_reporting.py "$SNAP" \
            --replay-root datasets/watch_calibrator_replay \
            --candidate-summary "$CAND" | tee "$SUMMARY"
          python3 - "$SUMMARY" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          if report.get('status') != 'PASS':
              raise SystemExit(f"Phase 3 reporting status is {report.get('status')!r}")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          test -s "$GEO/calibration_outcome_v1.jsonl"
          test -s "$GEO/coverage_funnel_v1.json"
          echo '### Phase 3 calibration outcome and coverage funnel' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always()
        run: |
          F="datasets/watch_calibrator/$MODEL/calibration.md"
          S="datasets/watch_calibrator/$MODEL/run_status.json"
          M="datasets/watch_calibrator/$MODEL/run_manifest.json"
          R="datasets/watch_calibrator/$MODEL/replica_evidence.json"
          D="datasets/watch_calibrator/$MODEL/dataset/source_diversity.json"
          RS="datasets/watch_calibrator_replay/$MODEL/run_status.json"
          RM="datasets/watch_calibrator_replay/$MODEL/run_manifest.json"
          RA="datasets/watch_calibrator_replay/$MODEL/replay_acceptance.json"
          CF="datasets/watch_calibrator_replay/$MODEL/geometry/coverage_funnel_v1.json"
          if [ -f "$F" ]; then cat "$F" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$D" ]; then echo '### Genuine source diversity' >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$D" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$R" ]; then echo '### Replica stress evidence' >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$R" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$M" ]; then echo '### Live run manifest' >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$M" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$RM" ]; then echo '### Measured-only replay manifest' >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$RM" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$RS" ]; then echo '### Measured-only replay' >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$RS" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$RA" ]; then echo '### Replay acceptance' >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$RA" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$CF" ]; then echo '### Coverage and sufficiency report' >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$CF" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f "$S" ]; then echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$S" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload complete calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-calibrator-${{ env.MODEL }}-${{ github.run_id }}
          path: |
            datasets/watch_calibrator/${{ env.MODEL }}/frozen_config.json
            datasets/watch_calibrator/${{ env.MODEL }}/run_manifest.json
            datasets/watch_calibrator/${{ env.MODEL }}/discovered_candidates.csv
            datasets/watch_calibrator/${{ env.MODEL }}/discovered_candidates.json
            datasets/watch_calibrator/${{ env.MODEL }}/dataset/acquired_images.csv
            datasets/watch_calibrator/${{ env.MODEL }}/dataset/candidate_summary.csv
            datasets/watch_calibrator/${{ env.MODEL }}/dataset/acquisition_report.*
            datasets/watch_calibrator/${{ env.MODEL }}/dataset/source_diversity.json
            datasets/watch_calibrator/${{ env.MODEL }}/replica_evidence.json
            datasets/watch_calibrator/${{ env.MODEL }}/locked_split.csv
            datasets/watch_calibrator/${{ env.MODEL }}/evidence_snapshot_v1/
            datasets/watch_calibrator/${{ env.MODEL }}/geometry/
            datasets/watch_calibrator/${{ env.MODEL }}/frozen_before_holdout.*
            datasets/watch_calibrator/${{ env.MODEL }}/legacy_split_calibration.*
            datasets/watch_calibrator/${{ env.MODEL }}/calibration.*
            datasets/watch_calibrator/${{ env.MODEL }}/run_status.json
            datasets/watch_calibrator_replay/${{ env.MODEL }}/frozen_config.json
            datasets/watch_calibrator_replay/${{ env.MODEL }}/run_manifest.json
            datasets/watch_calibrator_replay/${{ env.MODEL }}/snapshot_source.json
            datasets/watch_calibrator_replay/${{ env.MODEL }}/geometry/
            datasets/watch_calibrator_replay/${{ env.MODEL }}/calibration.*
            datasets/watch_calibrator_replay/${{ env.MODEL }}/run_status.json
            datasets/watch_calibrator_replay/${{ env.MODEL }}/replay_acceptance.json
            watch-calibrator.log
            watch-calibrator-replay.log
            watch-calibrator-phase2c.log
          if-no-files-found: warn
