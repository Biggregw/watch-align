name: Research photo intake to Dropbox

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Max original photos to attempt
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3', '5', '10']
      dry_run:
        description: Rights metadata only (no image downloads or Dropbox changes)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: watchalign-inbox-pilot
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install -q 'requests>=2.32,<3' 'Pillow>=10,<12'
      - name: Offline tests
        run: python -m unittest discover -s tools/research/tests -p 'test_dropbox_inbox_acquire.py' -v
      - name: Intake originals and verify Dropbox readback
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.WATCHALIGN_DROPBOX_ACCESS_TOKEN }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.WATCHALIGN_DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.WATCHALIGN_DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.WATCHALIGN_DROPBOX_APP_SECRET }}
        run: |
          if [[ '${{ github.event_name }}' == 'push' ]]; then
            args=(--limit 1)
          else
            args=(--limit '${{ inputs.limit }}')
            if [[ '${{ inputs.dry_run }}' == 'true' ]]; then args+=(--dry-run); fi
          fi
          python tools/research/dropbox_inbox_acquire.py "${args[@]}"
