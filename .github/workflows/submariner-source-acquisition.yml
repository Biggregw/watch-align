name: Submariner source acquisition

# Research-only acquisition for issue #34. It deliberately does not invoke the GMT analysis
# harness or production Android QC. Third-party image bytes are cached by Actions, not committed.
on:
  push:
    branches:
      - feature/submariner-family-harvester

permissions:
  contents: read

concurrency:
  group: submariner-source-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    if: github.event.head_commit.message == 'Run Submariner source pool acquisition'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install harvester dependencies
        run: python -m pip install -q -r tools/dataset_harvester/requirements.txt

      - name: Run deterministic harvester tests
        run: python -m unittest discover -s tools/dataset_harvester/tests

      - name: Restore Submariner image cache
        uses: actions/cache@v4
        with:
          path: datasets/submariner_research/images
          key: submariner-source-images-${{ github.run_id }}
          restore-keys: submariner-source-images-

      - name: Acquire phase-1 Submariner source pool
        run: |
          python3 tools/dataset_harvester/submariner_acquire.py \
            --pool docs/research/submariner_candidate_sources_2026-09-30.csv \
            --out datasets/submariner_research \
            --max-images 12 | tee submariner-acquisition.log

      - name: Summarise acquisition
        if: always()
        run: |
          if [ -f datasets/submariner_research/acquisition_report.md ]; then
            cat datasets/submariner_research/acquisition_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=Path('datasets/submariner_research/candidate_summary.csv')
          if not p.exists():
              raise SystemExit(0)
          rows=list(csv.DictReader(p.open()))
          for cls in ('genuine','replica'):
              got=[r for r in rows if r['class']==cls and int(r['images_acquired'] or 0)>0]
              print(f'{cls}: {len(got)} candidate physical-watch sources with images acquired')
          for model in ('124060','126610LN','126610LV'):
              got=[r for r in rows if r['model']==model and int(r['images_acquired'] or 0)>0]
              print(f'{model}: {len(got)} candidate sources with images acquired')
          PY

      - name: Upload acquisition manifests and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submariner-source-acquisition-${{ github.run_id }}
          path: |
            datasets/submariner_research/acquired_images.csv
            datasets/submariner_research/candidate_summary.csv
            datasets/submariner_research/acquisition_report.json
            datasets/submariner_research/acquisition_report.md
            submariner-acquisition.log
          if-no-files-found: warn
