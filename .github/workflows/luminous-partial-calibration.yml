name: Frozen partial-edge genuine calibration
on:
  push:
    branches: [research/luminous-partial-calibration-20261012]
    paths:
      - tools/research/luminous_partial_calibration/**
      - tools/desktop-harness/drivers/LuminousCalibrationStudy.java
      - .github/workflows/luminous-partial-calibration.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RESEARCH_OUT: docs/research/luminous-partial-calibration-2026-10-12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require byte-identical Android implementation and reference assets
        run: git diff --exit-code 8a53c1e5ccb71d927a654a265572d34d9a5c3397 -- android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==12.3.0
      - name: Isolated estimator/leakage tests and frozen native controls
        run: |
          python tools/research/luminous_partial_calibration/test_calibration.py
          bash tools/desktop-harness/run.sh LuminousSyntheticChecks
      - uses: actions/download-artifact@v4
        with:
          repository: Biggregw/watch-align
          run-id: '38222239457'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: WatchAlign-genuine-faceon-132-originals-Codex-ready
          path: curated-artifact
      - name: Verify all originals, identity quarantine, then split BEFORE measurements
        run: |
          python tools/luminous/prepare_curated.py curated-artifact luminous-calibration-work .
          python tools/research/luminous_partial_calibration/prepare.py luminous-calibration-work
      - name: Extract independent partial fits and full-boundary evidence using frozen method
        run: |
          for model in gmt_126710 submariner_124060 submariner_126610; do
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$model" bash tools/desktop-harness/run.sh LuminousCalibrationStudy extract "luminous-calibration-work/${model}_extract.csv" "luminous-calibration-work/${model}_raw.jsonl"
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$model" bash tools/desktop-harness/run.sh LuminousCalibrationStudy extract "luminous-calibration-work/${model}_processing.csv" "luminous-calibration-work/${model}_processing_raw.jsonl"
          done
      - name: Estimate development-only position references, bootstrap and grouped CV
        run: python tools/research/luminous_partial_calibration/calibrate.py luminous-calibration-work
      - name: Score fixed genuine references; held-out and OOF evidence never tune parameters
        run: |
          for model in gmt_126710 submariner_124060 submariner_126610; do
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$model" bash tools/desktop-harness/run.sh LuminousCalibrationStudy score "luminous-calibration-work/${model}_raw.jsonl" luminous-calibration-work/calibrated_references.json "luminous-calibration-work/${model}_scored.jsonl"
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$model" bash tools/desktop-harness/run.sh LuminousCalibrationStudy score "luminous-calibration-work/${model}_processing_raw.jsonl" luminous-calibration-work/calibrated_references.json "luminous-calibration-work/${model}_processing_scored.jsonl"
            for fold in 0 1 2 3 4; do
              JAVA_TOOL_OPTIONS="-Dwatchalign.model=$model -Dwatchalign.study.fold=$fold" bash tools/desktop-harness/run.sh LuminousCalibrationStudy score "luminous-calibration-work/${model}_raw.jsonl" "luminous-calibration-work/cv_${fold}_references.json" "luminous-calibration-work/${model}_cv_${fold}.jsonl"
            done
          done
      - name: Publish scalar audit, distributions, sensitivity and exact scored polygons
        run: python tools/research/luminous_partial_calibration/analyze.py luminous-calibration-work "$RESEARCH_OUT"
      - name: Render original crops and exact scored polygon regions for held-out extremes
        run: |
          for model in gmt_126710 submariner_124060 submariner_126610; do
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$model" bash tools/desktop-harness/run.sh LuminousCalibrationStudy gallery "luminous-calibration-work/${model}_scored.jsonl" "luminous-calibration-work/${model}_extract.csv" "luminous-calibration-work/${model}_gallery_select.txt" "$RESEARCH_OUT/gallery"
          done
      - name: Publish research outputs only
        run: |
          git diff --exit-code 8a53c1e5ccb71d927a654a265572d34d9a5c3397 -- android
          git add "$RESEARCH_OUT"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish frozen partial-edge calibration and held-out evidence [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luminous-partial-calibration-reproducible-results
          path: |
            luminous-calibration-work/*jsonl
            luminous-calibration-work/*json
            luminous-calibration-work/*csv
            docs/research/luminous-partial-calibration-2026-10-12/
          retention-days: 30
