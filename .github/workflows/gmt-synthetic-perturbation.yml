name: GMT synthetic perturbation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perturbation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless pillow requests beautifulsoup4
      - name: Bring in and verify pinned Stage 3 implementation
        shell: bash
        env:
          STAGE3_COMMIT: 8292512ddc427b80bb4534bd73a3f69a6a6d2905
          STAGE3_MODULE_BLOB: bef52f0f11badfc5eb1b1f69b3f6ec0245ca3e2a
        run: |
          git fetch origin "$STAGE3_COMMIT"
          actual_blob="$(git rev-parse "$STAGE3_COMMIT:tools/watch_align_py/gmt_proportional_features.py")"
          test "$actual_blob" = "$STAGE3_MODULE_BLOB"
          git checkout "$STAGE3_COMMIT" -- tools/watch_align_py
      - name: Run deterministic input-geometry perturbations
        run: python -u tools/research/gmt_synthetic_perturbation_runner.py
      - name: Show output
        if: always()
        run: |
          if [ -f docs/research/gmt-genuine-baseline-results/synthetic-perturbation.csv ]; then
            wc -l docs/research/gmt-genuine-baseline-results/synthetic-perturbation.csv
            head -20 docs/research/gmt-genuine-baseline-results/synthetic-perturbation.csv
          fi
      - name: Upload experiment output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmt-synthetic-perturbation
          path: docs/research/gmt-genuine-baseline-results/synthetic-perturbation.csv
          if-no-files-found: error
          retention-days: 14
