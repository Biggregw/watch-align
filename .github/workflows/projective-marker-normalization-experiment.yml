name: Projective marker normalisation experiment

# Read-only experiment on the separate experiment branch. It fetches the existing
# corpus, reprocesses only images previously accepted by the current engine, and
# compares the current ellipse-only marker coordinate normalisation with mapping the
# exact same detected marker centres through the inverse accepted final homography.
# No production pose/QC code, thresholds, master geometry or result files are changed.
on:
  push:
    branches:
      - experiment/projective-marker-normalization
    paths:
      - '.github/workflows/projective-marker-normalization-experiment.yml'
      - 'tools/watch_align_py/experiment_projective_marker_normalization.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projective-marker-normalization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dataset fetch dependencies
        run: python -m pip install -r datasets/126710BLNR/requirements.txt

      - name: Install Watch Align Python engine dependencies
        run: python -m pip install opencv-python-headless numpy

      - name: Fetch and normalise 126710BLNR sources (ephemeral)
        run: python datasets/126710BLNR/fetch_images.py --clean

      - name: Compare ellipse and projective marker normalisation
        run: |
          python tools/watch_align_py/experiment_projective_marker_normalization.py \
            --per-image-csv datasets/126710BLNR/results/per_image_measurements.csv \
            --images-root datasets/126710BLNR \
            --out-dir projective_marker_experiment

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projective-marker-normalization-experiment
          path: projective_marker_experiment/**
          retention-days: 14
          if-no-files-found: warn
