name: Watch Align OneDrive archive (protected)

# Manual-only until protection, storage renewal and review access are verified.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Archive operation; preflight requires no OneDrive credentials"
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - pilot
          - upload
          - verify
          - review
      pilot_count:
        description: "Pilot/review photo count (pilot 1-10; review 1-100)"
        type: number
        required: false
        default: 3
      review_offset:
        description: "Skip this many photos in a review batch; 0, 20, 40, etc."
        type: number
        required: false
        default: 0

permissions:
  contents: read
  actions: read

concurrency:
  group: watch-align-personal-onedrive-archive
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only recovered originals inventory
    if: ${{ inputs.task == 'preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing archive requirements
        run: python -m pip install -r tools/image_archive/requirements.txt
      - name: Download pre-existing original-photo artifact
        run: |
          mkdir -p "$RUNNER_TEMP/watch-align-originals"
          gh run download 37194686346 \
            --name watch-calibrator-124060-37194686346 \
            --dir "$RUNNER_TEMP/watch-align-originals"
      - name: Original byte inventory only
        run: |
          python -m tools.image_archive.cloud_jobs preflight \
            --repo "$GITHUB_WORKSPACE" --scan "$RUNNER_TEMP/watch-align-originals"

  protected-archive:
    name: OneDrive (owner-protected environment)
    if: ${{ inputs.task != 'preflight' }}
    environment: onedrive-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      ONEDRIVE_CLIENT_ID: ${{ vars.ONEDRIVE_CLIENT_ID }}
      ONEDRIVE_MSAL_CACHE: ${{ secrets.ONEDRIVE_MSAL_CACHE }}
      ONEDRIVE_CACHE_WRITE_TOKEN: ${{ secrets.ONEDRIVE_CACHE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install archive requirements and test runner
        run: python -m pip install -r tools/image_archive/requirements.txt pytest
      - name: Regression tests (no network or secrets)
        run: python -m pytest -q tools/image_archive/tests/test_unreviewed.py tools/image_archive/tests/test_cloud_jobs.py
      - name: Ensure protected environment is configured
        env:
          CHECK_CLIENT: ${{ vars.ONEDRIVE_CLIENT_ID }}
          CHECK_CACHE: ${{ secrets.ONEDRIVE_MSAL_CACHE }}
          CHECK_WRITER: ${{ secrets.ONEDRIVE_CACHE_WRITE_TOKEN }}
        run: |
          test -n "$CHECK_CLIENT" || { echo 'Missing ONEDRIVE_CLIENT_ID variable'; exit 1; }
          test -n "$CHECK_CACHE" || { echo 'Missing ONEDRIVE_MSAL_CACHE environment secret'; exit 1; }
          test -n "$CHECK_WRITER" || { echo 'Missing ONEDRIVE_CACHE_WRITE_TOKEN environment secret'; exit 1; }
      - name: Recover existing catalogued originals
        if: ${{ inputs.task == 'pilot' || inputs.task == 'upload' }}
        run: |
          mkdir -p "$RUNNER_TEMP/watch-align-originals"
          gh run download 37194686346 \
            --name watch-calibrator-124060-37194686346 \
            --dir "$RUNNER_TEMP/watch-align-originals"
      - name: Upload small pilot (only when explicitly selected)
        if: ${{ inputs.task == 'pilot' }}
        env:
          PILOT_COUNT: ${{ inputs.pilot_count }}
        run: |
          python -m tools.image_archive.cloud_jobs pilot \
            --repo "$GITHUB_WORKSPACE" --scan "$RUNNER_TEMP/watch-align-originals" \
            --limit "$PILOT_COUNT"
      - name: Upload all recovered original photos (explicit selection only)
        if: ${{ inputs.task == 'upload' }}
        run: |
          python -m tools.image_archive.cloud_jobs upload \
            --repo "$GITHUB_WORKSPACE" --scan "$RUNNER_TEMP/watch-align-originals"
      - name: Verify every indexed original by downloading and SHA-256
        if: ${{ inputs.task == 'verify' }}
        run: python -m tools.image_archive.cloud_jobs verify
      - name: Prepare a bounded photo-review ZIP (explicit selection only)
        if: ${{ inputs.task == 'review' }}
        env:
          REVIEW_COUNT: ${{ inputs.pilot_count }}
          REVIEW_OFFSET: ${{ inputs.review_offset }}
        run: |
          python -m tools.image_archive.cloud_jobs review \
            --limit "$REVIEW_COUNT" --offset "$REVIEW_OFFSET" \
            --output "$RUNNER_TEMP/watch-align-review.zip"
      - name: Publish manually requested review batch as an Actions artifact
        if: ${{ inputs.task == 'review' }}
        uses: actions/upload-artifact@v4
        with:
          name: watch-align-unreviewed-visual-review
          path: ${{ runner.temp }}/watch-align-review.zip
          retention-days: 3
          if-no-files-found: error
