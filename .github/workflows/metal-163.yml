# Experimental 1.6.3: the outer-metal fit in the app (MetalFit, ClearlyOff.METAL) against 1.6.2 (lume centre), both the
# app's own code (desktop harness) on identical photos: the sha256-verified GENUINE photos, the pinned public QC photos,
# and synthetic hand occlusions and known moves made in the genuine photos. Close-ups are printed base64 in the log.
name: Watch Align 1.6.3 experimental outer-metal fit (app, genuine + QC + synthetic)
on:
  push:
    branches: [claude/calibration-measurement-contract-epunh5]
    paths: ['.github/workflows/metal-163.yml', 'android/app/src/main/java/com/watchalign/mobile/MetalFit.java',
            'android/app/src/main/java/com/watchalign/mobile/ClearlyOff.java', 'android/app/src/main/java/com/watchalign/mobile/ClearlyOffEvidence.java',
            'tools/desktop-harness/drivers/TrackDump.java', 'tools/desktop-harness/drivers/MetalSynth.java', 'tools/research/track/app163_summary.py', 'tools/research/track/app163_scale.py',
            'android/app/src/main/java/com/watchalign/mobile/AlignmentAnalysis.java']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: gmt_126710, catalogue: tools/research/alpha96_calibration/catalogue_provenance_strong.csv, prefix: '126710'}
          - {model: submariner_124060, catalogue: tools/research/sub124060/catalogue_124060.csv, prefix: '124060'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q requests numpy scipy opencv-python-headless pillow==12.3.0
      - uses: actions/cache@v4
        with: {path: tools/desktop-harness/.cache/opencv-4.9.0-0.jar, key: opencv-4.9.0-0-jar}
      - name: Verified genuine photos (sha256-checked catalogue)
        run: |
          mkdir -p g out
          python3 - <<'PY'
          import csv
          rows = [r for r in csv.DictReader(open('${{ matrix.catalogue }}'))
                  if r.get('class_label', 'gen') == 'gen' and r['model'].startswith('${{ matrix.prefix }}')]
          w = csv.DictWriter(open('g/manifest.csv', 'w', newline=''), fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          PY
          python3 tools/research/alpha96_calibration/fetch_verified.py g/manifest.csv g/img g/fetch_log.csv | tail -3
      - name: Public QC photos (same sha256-pinned set as the A/B workflow)
        run: |
          mkdir -p q/img
          python3 - <<'PY'
          import requests, hashlib, csv, pathlib
          cases = [
           ('GMT_crooked6_1s4cszq','gmt_126710','https://i.redd.it/zsgyaaky0frg1.jpg','c36f1af94be604ec9153e77b42322d0396634af0eb955c2ab7d3841dce4bb6cd'),
           ('GMT_accepted6_18vdgh0','gmt_126710','https://i.redd.it/tqmt3k1f8o9c1.jpg','a041d20d14d7c9f105991496b539bb73d63182d75e3b61b6d5a8f0590ecd6c13'),
           ('GMT_accepted6_18vdgh0_photo2','gmt_126710','https://i.redd.it/fobj8k1f8o9c1.jpg','77245a16744f3fb1369bdaef2101593bd6b52de3a0f031946e3cd84ea9fe8217'),
           ('SUB_rejected12_1wgfy7k','submariner_124060','https://i.redd.it/0rx4t01hujph1.jpg','7c9f2b50f8e89b860bf567cebdc7a86f3268c5c5e04397f44314bbf5f3f2e0ba'),
           ('SUB_accepted12_1w848xb','submariner_124060','https://i.redd.it/wdaw7dp93qnh1.jpg','2fe59ac6f06f8effed25c288075ee931b608c874c66d536c6255524ae7a7f91f'),
           ('SUB_accepted12_1w848xb_photo5','submariner_124060','https://i.redd.it/zm5wgcp93qnh1.jpg','4c4f8cd97ef5e2c3aa8fe2f3a729f3e462b0bf3cd83ea38793419ea7313b2561'),
           ('SUB_control12_1kqn8ub','submariner_124060','https://i.redd.it/o3xibqc50t1f1.jpg','471e927748db033d97e3a0087f3cf66dbe2a374246185c72852488c18157a3b2')]
          s = requests.Session(); s.headers.update({'User-Agent': 'Mozilla/5.0 WatchAlignResearch/1.0', 'Referer': 'https://www.reddit.com/'})
          w = csv.writer(open('q/manifest.csv', 'w', newline='')); w.writerow(['photo_id', 'local_path', 'physical_watch_id'])
          for name, model, url, sha in cases:
              if model != '${{ matrix.model }}': continue
              try:
                  data = s.get(url, timeout=20).content
                  if hashlib.sha256(data).hexdigest() != sha: raise ValueError('sha256')
                  (pathlib.Path('q/img') / (name + '.jpg')).write_bytes(data); w.writerow([name, name + '.jpg', name])
              except Exception as e: print('QC not available:', name, e)
          PY
      - name: App code, 1.6.2 and 1.6.3, on genuine and QC photos
        env: {NAMED: '6ac54fe6dfcbd61a:4,6ac54fe6dfcbd61a:5,6ac54fe6dfcbd61a:7,efa51fd35fd54519:2'}
        run: |
          J=tools/desktop-harness/.cache/opencv-4.9.0-0.jar
          if [ ! -f "$J" ] || [ "$(stat -c %s "$J")" -lt 1000000 ]; then mkdir -p $(dirname $J); curl -fsSL -o "$J" https://repo1.maven.org/maven2/org/openpnp/opencv/4.9.0-0/opencv-4.9.0-0.jar; fi
          mkdir -p cls ev evq
          javac -encoding UTF-8 -nowarn -cp $J -sourcepath "tools/desktop-harness/shim:android/app/src/main/java" -d cls tools/desktop-harness/drivers/*.java
          java -Xmx3g -Dwatchalign.model=${{ matrix.model }} -Dwatchalign.metal=off -cp $J:cls com.watchalign.mobile.TrackDump g/manifest.csv g/img out/app_off.csv | grep -c TRACK
          java -Xmx3g -Dwatchalign.model=${{ matrix.model }} -Dwatchalign.render=ev -Dwatchalign.renderIds=$NAMED -cp $J:cls com.watchalign.mobile.TrackDump g/manifest.csv g/img out/app_on.csv | grep -c TRACK
          java -Xmx3g -Dwatchalign.model=${{ matrix.model }} -Dwatchalign.metal=off -cp $J:cls com.watchalign.mobile.TrackDump q/manifest.csv q/img out/qc_off.csv | grep -c TRACK
          IDS=$(python3 -c "import csv;print(','.join(r['photo_id']+':'+h for r in csv.DictReader(open('q/manifest.csv')) for h in ('12','8','9','6')))")
          java -Xmx3g -Dwatchalign.model=${{ matrix.model }} -Dwatchalign.render=evq -Dwatchalign.renderIds=$IDS -cp $J:cls com.watchalign.mobile.TrackDump q/manifest.csv q/img out/qc_on.csv | grep -c TRACK
      - name: Synthetic hand occlusions and known moves (first 40 genuine photos), 1.6.2 and 1.6.3
        run: |
          J=tools/desktop-harness/.cache/opencv-4.9.0-0.jar
          java -Xmx3g -Dwatchalign.model=${{ matrix.model }} -Dwatchalign.metal=off -cp $J:cls com.watchalign.mobile.MetalSynth g/manifest.csv g/img out/synth_off.csv 40 | grep -c SYNTH
          java -Xmx3g -Dwatchalign.model=${{ matrix.model }} -cp $J:cls com.watchalign.mobile.MetalSynth g/manifest.csv g/img out/synth_on.csv 40 | grep -c SYNTH
      - name: Summary
        run: python3 tools/research/track/app163_summary.py out/app_off.csv out/app_on.csv out/qc_off.csv out/qc_on.csv out/synth_off.csv out/synth_on.csv 6ac54fe6df efa51fd35f | tee out/summary.txt
      - name: Lower resolution (the same genuine and QC photos downscaled to 70 / 50 / 35 %), 1.6.3
        run: |
          J=tools/desktop-harness/.cache/opencv-4.9.0-0.jar
          python3 - <<'PY'
          import csv, os
          from PIL import Image
          for src, man in (('g', 'g/manifest.csv'), ('q', 'q/manifest.csv')):
              rows = list(csv.DictReader(open(man)))[:60]
              for s in (0.7, 0.5, 0.35):
                  d = '%s%d' % (src, int(s * 100)); os.makedirs(d + '/img', exist_ok=True)
                  w = csv.DictWriter(open(d + '/manifest.csv', 'w', newline=''), fieldnames=list(rows[0])); w.writeheader()
                  for r in rows:
                      p = os.path.join(src + '/img', r['local_path'])
                      if not os.path.exists(p): continue
                      im = Image.open(p); im = im.convert('RGB').resize((max(1, round(im.width * s)), max(1, round(im.height * s))), Image.LANCZOS)
                      q = os.path.join(d + '/img', r['local_path']); os.makedirs(os.path.dirname(q), exist_ok=True)
                      im.save(q, 'JPEG', quality=90); w.writerow(r)
          PY
          for d in g70 g50 g35 q70 q50 q35; do
            java -Xmx3g -Dwatchalign.model=${{ matrix.model }} -cp $J:cls com.watchalign.mobile.TrackDump $d/manifest.csv $d/img out/app_$d.csv | grep -c TRACK
          done
          python3 tools/research/track/app163_scale.py out/app_on.csv 70:out/app_g70.csv 50:out/app_g50.csv 35:out/app_g35.csv | tee out/scale_genuine.txt
          python3 tools/research/track/app163_scale.py out/qc_on.csv 70:out/app_q70.csv 50:out/app_q50.csv 35:out/app_q35.csv | tee out/scale_qc.txt
      - name: Close-ups (base64 JPEG in the log; genuine flagged and named, QC 12/8/9/6 and flagged)
        run: |
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          files = sorted(glob.glob('ev/*.png'))[:30] + sorted(glob.glob('evq/*.png'))[:40]
          print('close-ups:', len(glob.glob('ev/*.png')), 'genuine,', len(glob.glob('evq/*.png')), 'QC')
          for p in files:
              im = Image.open(p).convert('RGB'); im = im.resize((480, int(im.height * 480 / im.width)))
              b = io.BytesIO(); im.save(b, 'JPEG', quality=72)
              print('IMG', ('q_' if p.startswith('evq') else 'g_') + os.path.basename(p)[:-4] + '.jpg', base64.b64encode(b.getvalue()).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal163-${{ matrix.model }}
          path: out/
          retention-days: 14
