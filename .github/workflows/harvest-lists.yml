# RESEARCH ONLY. Photo lists from the Bob's Rolex Harvester ("Photo list": listing, image URL, sha256; no images),
# committed to tools/research/harvest_lists/. Re-downloads every listed original, keeps only byte-identical files
# (fetch_verified.py), runs the app's analysis (date references on the GMT 126710 model, no-date on the 124060 model) and
# the per-family geometry report (tools/research/generic_sub). Images are never committed or uploaded.
name: Harvest lists (generic Submariner research)

on:
  push:
    branches:
      - feature/android-alpha102-submariner
    paths:
      - 'tools/research/harvest_lists/**'
      - 'tools/research/generic_sub/**'
      - '.github/workflows/harvest-lists.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUT: hl_out
      IMG: hl_images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests opencv-python-headless
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: OpenCV jar cache
        uses: actions/cache@v4
        with:
          path: tools/desktop-harness/.cache/opencv-4.9.0-0.jar
          key: opencv-4.9.0-0-jar
      - name: Manifests and verified fetch
        run: |
          mkdir -p "$OUT" "$IMG"
          python3 tools/research/generic_sub/harvest_report.py manifest tools/research/harvest_lists "$OUT"
          python3 tools/research/alpha96_calibration/fetch_verified.py "$OUT/manifest_all.csv" "$IMG" "$OUT/fetch_log.csv"
      - name: Geometry (124060 model, every photo)
        env:
          JAVA_TOOL_OPTIONS: -Dwatchalign.model=submariner_124060 -Dwatchalign.models_root=tools/research/sub124060
        run: tools/desktop-harness/run.sh Alpha96Calib "$OUT/manifest_all.csv" "$IMG" "$OUT/per_photo.csv" 2> "$OUT/runner_progress.txt"
      - name: App findings (date on GMT 126710, no-date on 124060)
        run: |
          JAVA_TOOL_OPTIONS=-Dwatchalign.model=gmt_126710 tools/desktop-harness/run.sh Alpha99Preview "$OUT/manifest_date.csv" "$IMG" "$OUT/date" --no-images > "$OUT/findings_date.txt" || true
          JAVA_TOOL_OPTIONS=-Dwatchalign.model=submariner_124060 tools/desktop-harness/run.sh Alpha99Preview "$OUT/manifest_nodate.csv" "$IMG" "$OUT/nodate" --no-images > "$OUT/findings_nodate.txt" || true
      - name: Report
        run: |
          python3 tools/research/generic_sub/harvest_report.py report "$OUT" "$OUT/per_photo.csv" "$OUT/fetch_log.csv" tools/research/sub124060/results/runner/per_photo.csv
          echo; echo "=== findings headlines"
          grep -hE "^==|clear|worth a look" "$OUT"/findings_*.txt || true
      - name: Upload CSVs (no images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-lists-${{ github.run_id }}
          retention-days: 30
          path: |
            hl_out/*.csv
            hl_out/*.txt
            hl_out/*/findings.csv
