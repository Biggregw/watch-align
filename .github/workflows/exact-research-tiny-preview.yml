name: Tiny exact research preview

on:
  push:
    branches:
      - research/opposing-minute-perspective
    paths:
      - '.github/workflows/exact-research-tiny-preview.yml'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pillow
      - name: Create tiny preview from exact committed frame
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('docs/calibration/opposing-minute-real/exact-test-photo-small-gen_wex_1TDYtpN-image_05.jpg')
          dst=Path('docs/calibration/opposing-minute-real/exact-test-photo-tiny-gen_wex_1TDYtpN-image_05.jpg')
          im=Image.open(src).convert('RGB')
          im.thumbnail((240,240))
          im.save(dst, quality=38, optimize=True)
          print(dst, im.size, dst.stat().st_size)
          PY
      - name: Commit tiny preview
        run: |
          git config user.name 'watch-align-research-bot'
          git config user.email 'watch-align-research-bot@users.noreply.github.com'
          git add docs/calibration/opposing-minute-real/exact-test-photo-tiny-gen_wex_1TDYtpN-image_05.jpg
          git commit -m 'Add tiny exact test preview'
          git push origin HEAD:research/opposing-minute-perspective
