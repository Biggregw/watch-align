name: GMT genuine marker baseline

on:
  workflow_dispatch:
  push:
    branches:
      - research/proportional-geometry-knowledge-base
    paths:
      - 'docs/research/gmt-genuine-baseline-source-manifest.csv'
      - 'tools/research/build_gmt_genuine_baseline.py'
      - 'tools/validate_genuine_baseline.py'
      - '.github/workflows/gmt-genuine-baseline.yml'

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout shared research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bring in frozen Stage 3 Python measurement implementation
        shell: bash
        env:
          STAGE3_COMMIT: 8292512ddc427b80bb4534bd73a3f69a6a6d2905
          STAGE3_MODULE_BLOB: bef52f0f11badfc5eb1b1f69b3f6ec0245ca3e2a
        run: |
          git fetch origin "$STAGE3_COMMIT"
          actual_blob="$(git rev-parse "$STAGE3_COMMIT:tools/watch_align_py/gmt_proportional_features.py")"
          test "$actual_blob" = "$STAGE3_MODULE_BLOB"
          git checkout "$STAGE3_COMMIT" -- tools/watch_align_py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless pillow requests beautifulsoup4

      - name: Bound dealer acquisition for first empirical batch
        shell: bash
        run: |
          # Keep the research implementation unchanged in git while preventing a
          # single slow dealer/gallery from consuming the entire Actions budget.
          sed -i 's/MAX_IMAGES_PER_SOURCE = 8/MAX_IMAGES_PER_SOURCE = 3/' tools/research/build_gmt_genuine_baseline.py
          sed -i 's/MAX_CANDIDATE_URLS = 80/MAX_CANDIDATE_URLS = 12/' tools/research/build_gmt_genuine_baseline.py
          sed -i 's/timeout=35/timeout=8/g' tools/research/build_gmt_genuine_baseline.py
          sed -i 's/timeout=30/timeout=8/g' tools/research/build_gmt_genuine_baseline.py

      - name: Build genuine-image marker baseline
        run: python -u tools/research/build_gmt_genuine_baseline.py

      - name: Validate physical-watch baseline stability
        run: python -u tools/validate_genuine_baseline.py

      - name: Show summary
        if: always()
        shell: bash
        run: |
          if [ -f docs/research/gmt-genuine-baseline-results/summary.json ]; then
            cat docs/research/gmt-genuine-baseline-results/summary.json
          fi
          if [ -f docs/research/gmt-genuine-baseline-results/BASELINE_VALIDATION.md ]; then
            echo '--- stability validation ---'
            cat docs/research/gmt-genuine-baseline-results/BASELINE_VALIDATION.md
          fi
          if [ -f docs/research/gmt-genuine-baseline-results/source_status.csv ]; then
            echo '--- source status ---'
            cat docs/research/gmt-genuine-baseline-results/source_status.csv
          fi

      - name: Commit numerical research outputs
        shell: bash
        run: |
          # Do not commit the temporary CI-only acquisition bounds or frozen Stage 3 copy.
          git reset tools/watch_align_py tools/research/build_gmt_genuine_baseline.py || true
          git checkout -- tools/watch_align_py tools/research/build_gmt_genuine_baseline.py || true
          git config user.name 'watch-align-research-bot'
          git config user.email 'watch-align-research-bot@users.noreply.github.com'
          git add docs/research/gmt-genuine-baseline-results
          if git diff --cached --quiet; then
            echo 'No result changes to commit'
            exit 0
          fi
          git commit -m 'research: add genuine GMT baseline stability results'
          git pull --rebase origin research/proportional-geometry-knowledge-base
          git push origin HEAD:research/proportional-geometry-knowledge-base

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmt-genuine-marker-baseline
          path: docs/research/gmt-genuine-baseline-results/**
          if-no-files-found: warn
          retention-days: 7