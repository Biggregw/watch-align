name: GMT genuine marker baseline

on:
  workflow_dispatch:
  push:
    branches:
      - research/proportional-geometry-knowledge-base
    paths:
      - 'docs/research/gmt-genuine-baseline-source-manifest.csv'
      - 'tools/research/build_gmt_genuine_baseline.py'
      - '.github/workflows/gmt-genuine-baseline.yml'

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout shared research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bring in frozen Stage 3 Python measurement implementation
        shell: bash
        run: |
          git fetch origin experiment/gmt-proportional-geometry-v1
          git checkout origin/experiment/gmt-proportional-geometry-v1 -- tools/watch_align_py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless pillow requests beautifulsoup4

      - name: Build genuine-image marker baseline
        run: python tools/research/build_gmt_genuine_baseline.py

      - name: Show summary
        if: always()
        shell: bash
        run: |
          if [ -f docs/research/gmt-genuine-baseline-results/summary.json ]; then
            cat docs/research/gmt-genuine-baseline-results/summary.json
          fi
          if [ -f docs/research/gmt-genuine-baseline-results/source_status.csv ]; then
            echo '--- source status ---'
            cat docs/research/gmt-genuine-baseline-results/source_status.csv
          fi

      - name: Commit numerical research outputs
        shell: bash
        run: |
          git reset tools/watch_align_py || true
          git checkout -- tools/watch_align_py || true
          git config user.name 'watch-align-research-bot'
          git config user.email 'watch-align-research-bot@users.noreply.github.com'
          git add docs/research/gmt-genuine-baseline-results
          if git diff --cached --quiet; then
            echo 'No result changes to commit'
            exit 0
          fi
          git commit -m 'research: add diverse genuine GMT marker baseline results'
          git push origin HEAD:research/proportional-geometry-knowledge-base

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmt-genuine-marker-baseline
          path: docs/research/gmt-genuine-baseline-results/**
          if-no-files-found: warn
          retention-days: 7
