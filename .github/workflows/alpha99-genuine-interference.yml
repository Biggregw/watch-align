name: Alpha99 genuine interference check (research)

# RESEARCH ONLY. Restores the sha256-verified genuine catalogue photos (as the Alpha96 calibration job does) and runs
# the Alpha99 evidence layer on them through the desktop harness: the per-marker hand / glare interference check
# (Alpha99Interference) and the full Alpha99 classification next to Alpha98 (Alpha99Preview). Prints how often each
# marker is withheld and every Alpha98 -> Alpha99 status change, and fails if Alpha99 reports anything outside the
# genuine range that Alpha98 did not. Only CSVs are uploaded; images are never committed, cached or uploaded.
on:
  push:
    branches:
      - feature/android-alpha99-hybrid-results
    paths:
      - '.github/workflows/alpha99-genuine-interference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CAL: tools/research/alpha96_calibration
      IMG: a99_images
      OUT: a99_results
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -q requests

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: OpenCV jar cache
        uses: actions/cache@v4
        with:
          path: tools/desktop-harness/.cache/opencv-4.9.0-0.jar
          key: opencv-4.9.0-0-jar

      - name: Fetch catalogued photos (sha256-verified)
        run: |
          mkdir -p "$IMG" "$OUT"
          python3 "$CAL/fetch_verified.py" "$CAL/catalogue_provenance_strong.csv" "$IMG" "$OUT/fetch_log.csv"

      - name: Interference check
        run: tools/desktop-harness/run.sh Alpha99Interference "$CAL/catalogue_provenance_strong.csv" "$IMG" "$OUT" --no-images > "$OUT/interference_log.txt"

      - name: Alpha99 classification next to Alpha98
        run: tools/desktop-harness/run.sh Alpha99Preview "$CAL/catalogue_provenance_strong.csv" "$IMG" "$OUT" --no-images > "$OUT/preview_log.txt"

      - name: Upload CSVs (no images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha99-genuine-interference-${{ github.run_id }}
          retention-days: 30
          path: |
            a99_results/*.csv
            a99_results/*.txt

      - name: Summary (fails on any new finding)
        run: |
          python3 "$CAL/alpha99_genuine_summary.py" "$OUT/findings.csv" "$OUT/interference.csv" "$CAL/catalogue_provenance_strong.csv"

      - name: Print per-photo results to log
        if: always()
        run: |
          cat "$OUT/interference_log.txt" || true
          cat "$OUT/preview_log.txt" || true
