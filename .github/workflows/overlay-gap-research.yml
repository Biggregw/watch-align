# Overlay-gap research (never part of the app): runs the marker-position methods in tools/research/overlay_gap on the
# sha256-verified GENUINE photos. GMT 126710: full ground-truth benchmark (each marker moved inside the photo by known
# amounts). Submariner 124060: how far genuine markers sit from the overlay (base measurements only). Summaries are
# printed to the log; the CSVs are uploaded as artifacts.
name: Overlay-gap research (genuine photos)
on:
  push:
    branches: [claude/calibration-measurement-contract-epunh5]
    paths: ['.github/workflows/overlay-gap-research.yml', 'tools/research/overlay_gap/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: gmt_126710, catalogue: tools/research/alpha96_calibration/catalogue_provenance_strong.csv, prefix: '126710', base_only: ''}
          - {model: submariner_124060, catalogue: tools/research/sub124060/catalogue_124060.csv, prefix: '124060', base_only: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q requests numpy scipy opencv-python-headless pillow==12.3.0
      - uses: actions/cache@v4
        with: {path: tools/desktop-harness/.cache/opencv-4.9.0-0.jar, key: opencv-4.9.0-0-jar}
      - name: Verified genuine photos (sha256-checked catalogue)
        run: |
          mkdir -p g out
          python3 - <<'PY'
          import csv
          rows = [r for r in csv.DictReader(open('${{ matrix.catalogue }}'))
                  if r.get('class_label', 'gen') == 'gen' and r['model'].startswith('${{ matrix.prefix }}')]
          w = csv.DictWriter(open('g/manifest.csv', 'w', newline=''), fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          PY
          python3 tools/research/alpha96_calibration/fetch_verified.py g/manifest.csv g/img g/fetch_log.csv | tail -1
      - name: Export the app's overlay for every photo
        run: |
          J=tools/desktop-harness/.cache/opencv-4.9.0-0.jar
          if [ ! -f "$J" ] || [ "$(stat -c %s "$J")" -lt 1000000 ]; then mkdir -p $(dirname $J); curl -fsSL -o "$J" https://repo1.maven.org/maven2/org/openpnp/opencv/4.9.0-0/opencv-4.9.0-0.jar; fi
          mkdir -p cls
          javac -encoding UTF-8 -nowarn -cp $J -sourcepath "tools/desktop-harness/shim:android/app/src/main/java" -d cls tools/desktop-harness/drivers/*.java
          java -Xmx3g -Dwatchalign.model=${{ matrix.model }} -cp $J:cls com.watchalign.mobile.OverlayDump g/manifest.csv g/img out/dump.jsonl | grep -c DUMP
      - name: Measure (all methods)
        env: {OMP_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1', BENCH_BASE_ONLY: '${{ matrix.base_only }}'}
        run: python3 tools/research/overlay_gap/benchmark.py out/dump.jsonl g/img out/bench.csv 4 | tail -2
      - name: Summary
        run: |
          echo "## genuine markers vs the overlay"; python3 tools/research/overlay_gap/summarise.py genuine out/bench.csv
          if [ -z "${{ matrix.base_only }}" ]; then echo "## ground-truth accuracy"; python3 tools/research/overlay_gap/summarise.py accuracy out/bench.csv; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-gap-${{ matrix.model }}
          path: out/
          retention-days: 7
