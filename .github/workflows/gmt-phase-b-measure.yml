name: GMT Phase B - genuine control-set measurement

# Runs the FROZEN Phase A detector (tools/research/phase_a_landmarks.py,
# unmodified) against every image accepted in
# datasets/gmt_phase_b_genuine/accepted_images.csv, then aggregates per-watch
# and population statistics for the Phase A ratios. No perspective
# correction, no Stage 3 machinery, no pose estimation. See
# docs/architecture/QC_PRINCIPLES.md and
# docs/research/GMT_12_TRIANGLE_FRONTAL_MILESTONE.md's Phase B.
on:
  push:
    branches:
      - reset/local-landmark-ratio-qc
    paths:
      - 'datasets/gmt_phase_b_genuine/accepted_images.csv'
      - 'tools/research/phase_a_landmarks.py'
      - 'tools/research/phase_a_harness.py'
      - 'tools/research/phase_b_measure.py'
      - 'tools/research/phase_b_aggregate.py'
      - 'tools/research/phase_b_print_overlays.py'
      - '.github/workflows/gmt-phase-b-measure.yml'
  workflow_dispatch:
    inputs:
      source_id:
        description: 'Limit measurement to one source_id (blank = all accepted images)'
        required: false
        default: ''
      print_prefix:
        description: 'Overlay label prefix for the closeup print step (blank = small sweep of all)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: gmt-phase-b-measure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q Pillow numpy requests beautifulsoup4 opencv-python-headless

      - name: Bring in seed_detector.py (dial-locator primitive only)
        run: |
          git fetch origin experiment/gmt-proportional-geometry-v1
          git show origin/experiment/gmt-proportional-geometry-v1:tools/watch_align_py/seed_detector.py \
            > tools/research/seed_detector.py

      - name: Run Phase B measurement (frozen Phase A detector)
        id: measure
        env:
          SOURCE_ID: ${{ github.event.inputs.source_id }}
        run: |
          PYTHONPATH=tools/research python3 tools/research/phase_b_measure.py "$SOURCE_ID"

      - name: Run Phase B aggregation
        run: python3 tools/research/phase_b_aggregate.py

      - name: Upload overlays as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmt-phase-b-overlays
          path: docs/research/gmt-phase-b-results/overlays/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit pixel-free measurement outputs
        if: always()
        shell: bash
        run: |
          rm -f tools/research/seed_detector.py
          git config user.name 'watch-align-research-bot'
          git config user.email 'watch-align-research-bot@users.noreply.github.com'
          git add docs/research/gmt-phase-b-results/per_image_measurements.csv \
                  docs/research/gmt-phase-b-results/per_image_measurements.json \
                  docs/research/gmt-phase-b-results/per_physical_watch_medians.csv \
                  docs/research/gmt-phase-b-results/population_summary.csv \
                  docs/research/gmt-phase-b-results/population_summary.json
          if git diff --cached --quiet; then
            echo 'No result changes to commit'
            exit 0
          fi
          git commit -m 'research: add Phase B genuine control-set measurement results'
          git push origin HEAD:${{ github.ref_name }}

      - name: Print overlay sweep as base64 JPEG (log-only, LAST STEP)
        # Deliberately the final step -- see gmt-phase-a-measure.yml's own
        # comment for why this must be the job's true last stdout output.
        env:
          PRINT_PREFIX: ${{ github.event.inputs.print_prefix }}
        run: python3 tools/research/phase_b_print_overlays.py "$PRINT_PREFIX"
