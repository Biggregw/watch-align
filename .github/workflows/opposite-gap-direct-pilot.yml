name: Direct same-unit 12 to 6 gap pilot

on:
  push:
    branches:
      - research/opposing-minute-perspective
    paths:
      - 'tools/desktop-harness/drivers/OppositeGap.java'
      - '.github/workflows/opposite-gap-direct-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-gap-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install image fetch dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r datasets/126710BLNR/requirements.txt numpy

      - name: Measure same-unit 12 and 6 clearances
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/direct-gap
          SOURCES=(
            gen_wex_e99gXKb
            gen_wex_1TDYtpN
            gen_wex_vmbUDwy
          )
          for SOURCE in "${SOURCES[@]}"; do
            echo "=== $SOURCE ==="
            python3 datasets/126710BLNR/fetch_images.py --clean --source "$SOURCE" || true
            tools/desktop-harness/run.sh OppositeGap \
              datasets/126710BLNR/resolved_images.csv \
              datasets/126710BLNR > "/tmp/direct-gap/${SOURCE}.csv"
            cat "/tmp/direct-gap/${SOURCE}.csv"
          done

      - name: Evaluate held-out within-watch repeatability
        run: |
          python3 - <<'PY'
          import csv, math, statistics
          from pathlib import Path
          import numpy as np

          rows=[]
          for p in sorted(Path('/tmp/direct-gap').glob('*.csv')):
              with p.open(newline='',encoding='utf-8') as f:
                  rows.extend(csv.DictReader(f))

          def num(r,k):
              try:
                  v=float(r.get(k,''));return v if math.isfinite(v) else None
              except Exception:return None
          def yes(r,k):return str(r.get(k,'')).lower()=='true'

          usable=[r for r in rows if yes(r,'twelve_stable') and yes(r,'six_stable') and num(r,'gap12_r') is not None and num(r,'gap6_r') is not None]
          by={}
          for r in usable:by.setdefault(r['watch'],[]).append(r)

          cal_id='gen_wex_e99gXKb'
          cal=by.get(cal_id,[])
          beta=float('nan')
          cal_corr=float('nan')
          if len(cal)>=3:
              x=np.array([num(r,'gap6_r') for r in cal],float)
              y=np.array([num(r,'gap12_r') for r in cal],float)
              x=x-np.median(x);y=y-np.median(y)
              den=float(x@x)
              beta=float((x@y)/den) if den>1e-12 else float('nan')
              if np.std(x)>0 and np.std(y)>0:cal_corr=float(np.corrcoef(x,y)[0,1])

          print('# Direct same-unit 12 to 6 gap pilot')
          print()
          print(f'total detector-stable paired images: {len(usable)}')
          for wid,rs in sorted(by.items()):print(f'{wid}: stable paired images={len(rs)}')
          print()
          print(f'calibration beta d12/d6: {beta:+.6f}')
          print(f'calibration correlation: {cal_corr:+.4f}')
          print()
          print('| watch | split | n | raw 12 sd | corrected 12 sd | improvement | within-watch corr |')
          print('|---|---|---:|---:|---:|---:|---:|')
          watch_results=[]
          for wid,rs in sorted(by.items()):
              if len(rs)<3:continue
              g12=np.array([num(r,'gap12_r') for r in rs],float)
              g6=np.array([num(r,'gap6_r') for r in rs],float)
              raw=float(np.std(g12,ddof=1)) if len(g12)>1 else float('nan')
              corrected=g12-beta*(g6-np.median(g6)) if math.isfinite(beta) else np.full_like(g12,np.nan)
              corrsd=float(np.std(corrected,ddof=1)) if len(g12)>1 and math.isfinite(beta) else float('nan')
              imp=100*(1-corrsd/raw) if raw>1e-12 and math.isfinite(corrsd) else float('nan')
              corr=float(np.corrcoef(g6,g12)[0,1]) if np.std(g6)>0 and np.std(g12)>0 else float('nan')
              split=rs[0].get('split','')
              print(f'| {wid} | {split} | {len(rs)} | {raw:.6f} | {corrsd:.6f} | {imp:+.1f}% | {corr:+.3f} |')
              watch_results.append((wid,split,imp,corr,raw,corrsd))

          vals=[x[2] for x in watch_results if x[1]=='validation' and math.isfinite(x[2])]
          print()
          if vals:print(f'validation median repeatability improvement: {statistics.median(vals):+.1f}%')
          else:print('validation median repeatability improvement: unavailable')
          print()
          print('Interpretation rule: promote nothing unless the calibration relationship has the expected complementary sign and reduces within-watch 12 spread on each independent validation watch. Manufacturing differences between different watches are not treated as pose noise.')
          PY

      - name: Upload numeric research output
        uses: actions/upload-artifact@v4
        with:
          name: direct-gap-pilot
          path: /tmp/direct-gap/*.csv
          retention-days: 7
