name: Alpha91 Cardinal macOS APK

on:
  push:
    branches:
      - ci/alpha91-cardinal-macos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-alpha91:
    runs-on: macos-14
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Prepare shared signing key
        env:
          WATCHALIGN_KEYSTORE_B64: ${{ secrets.WATCHALIGN_KEYSTORE_B64 }}
        run: |
          if [ -n "$WATCHALIGN_KEYSTORE_B64" ]; then
            python3 - <<'PY'
          import os, base64
          p=os.path.join(os.environ['RUNNER_TEMP'],'watchalign-release.p12')
          open(p,'wb').write(base64.b64decode(os.environ['WATCHALIGN_KEYSTORE_B64']))
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('WATCHALIGN_KEYSTORE_FILE='+p+'\n')
          PY
          fi
      - name: Build APK
        env:
          WATCHALIGN_KEYSTORE_PASSWORD: ${{ secrets.WATCHALIGN_KEYSTORE_PASSWORD }}
        run: bash ./gradlew :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WatchAlign-Alpha91-cardinal-anchor-arm64.apk
          shasum -a 256 WatchAlign-Alpha91-cardinal-anchor-arm64.apk > SHA256SUMS-Alpha91.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-Alpha91-cardinal-anchor-arm64
          path: |
            android/WatchAlign-Alpha91-cardinal-anchor-arm64.apk
            android/SHA256SUMS-Alpha91.txt
          if-no-files-found: error
          retention-days: 30
