name: Build experimental luminous arm64 test APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require bounded photographic validation and experimental references
        working-directory: .
        run: |
          test -s docs/research/luminous-experiment-2026-10-12/README.md
          for model in gmt_126710 submariner_124060 submariner_126610; do
            test -s "android/app/src/main/assets/experimental/luminous/$model.json"
            test -s "docs/research/luminous-experiment-2026-10-12/${model}_heldout.csv"
          done
          git diff --exit-code b8acf22ce7b6afab768d89349a87d514a20b78c9 -- android/app/src/main/assets/experimental/luminous
          git diff --exit-code 593966433079d04816e98f78da5b66abd1f4553d -- android/app/src/main/assets/models android/app/src/main/java/com/watchalign/mobile/Alpha99Pipeline.java android/app/src/main/java/com/watchalign/mobile/Alpha94MarkerMeasurement.java android/app/src/main/java/com/watchalign/mobile/Alpha99Findings.java android/app/src/main/java/com/watchalign/mobile/ExpectedMarkerOutline.java android/app/src/main/java/com/watchalign/mobile/MarkerPolygonMismatch.java android/app/src/main/java/com/watchalign/mobile/MarkerMismatchOverlay.java
      - name: Install existing Android toolchain
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run all Android unit tests
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Native shape/resolution/hand and recorded control checks
        working-directory: .
        run: |
          bash tools/desktop-harness/run.sh LuminousSyntheticChecks
          python3 tools/luminous/verify_controls.py
      - name: Prepare existing shared signing key
        env:
          WATCHALIGN_KEYSTORE_B64: ${{ secrets.WATCHALIGN_KEYSTORE_B64 }}
        run: |
          if [ -n "$WATCHALIGN_KEYSTORE_B64" ]; then
            echo "$WATCHALIGN_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/watchalign-release.p12"
            echo "WATCHALIGN_KEYSTORE_FILE=$RUNNER_TEMP/watchalign-release.p12" >> "$GITHUB_ENV"
          else
            echo '::warning::Shared signing key unavailable; debug key requires separate installation.'
          fi
      - name: Build arm64 APK
        env:
          WATCHALIGN_KEYSTORE_PASSWORD: ${{ secrets.WATCHALIGN_KEYSTORE_PASSWORD }}
        run: bash ./gradlew :app:assembleDebug --stacktrace
      - name: Verify package, ABI, size and signing certificate
        env:
          HAS_KEY: ${{ secrets.WATCHALIGN_KEYSTORE_B64 != '' }}
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > apk-package.txt
          grep -q "package: name='com.watchalign.mobile.poc.edgefit.luminousfit'" apk-package.txt
          unzip -l "$apk" | awk '/lib\/.*\.so/ {print $4}' > apk-native-libraries.txt
          test -s apk-native-libraries.txt
          if grep -v '^lib/arm64-v8a/' apk-native-libraries.txt; then exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > apk-signing.txt
          if [ "$HAS_KEY" = true ]; then
            want=$(tr -d ':\n ' < signing/watchalign-cert-sha256.txt | tr 'A-F' 'a-f')
            got=$(awk '/certificate SHA-256 digest/ {print $NF; exit}' apk-signing.txt)
            test "$got" = "$want"
          fi
          size=$(stat -c %s "$apk")
          echo "APK bytes: $size"
          if [ "$size" -gt 30000000 ]; then echo '::warning::APK exceeds preferred 30 MB.'; fi
          cp "$apk" WatchAlign-alpha107.2-luminous-fit-arm64.apk
          sha256sum WatchAlign-alpha107.2-luminous-fit-arm64.apk > SHA256SUMS.txt
          git rev-parse HEAD > APK_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-alpha107.2-luminous-fit-arm64
          path: |
            android/WatchAlign-alpha107.2-luminous-fit-arm64.apk
            android/SHA256SUMS.txt
            android/APK_COMMIT.txt
            android/apk-signing.txt
            android/apk-native-libraries.txt
            android/apk-package.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luminous-apk-unit-test-reports
          path: android/app/build/test-results/
          retention-days: 30
