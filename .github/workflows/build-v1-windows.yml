name: Build Watch Align V1 Windows

on:
  push:
    branches:
      - feature/v1.2-ux-consensus
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch-align-v1-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pystray pytest httpx
      - name: Run V1 regression tests
        shell: pwsh
        run: |
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
          python -c "import v1_full; from v1_confidence_v110 import install; install(v1_full); from pathlib import Path; Path('ui-test.js').write_text(v1_full.V1_JS, encoding='utf-8')"
          node tests/ui_confidence.cjs ui-test.js
          if ($LASTEXITCODE -ne 0) { throw 'UI regression tests failed' }
      - name: Build Windows app
        shell: pwsh
        run: pyinstaller --clean --noconfirm WatchAlign.spec
      - name: Smoke-check build output
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/WatchAlign/WatchAlign.exe')) { throw 'WatchAlign.exe was not produced.' }
          $env:WATCH_ALIGN_SMOKE_RESULT = "$pwd/smoke-result.json"
          $process = Start-Process -FilePath 'dist/WatchAlign/WatchAlign.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'EXE smoke test timed out' }
          if ($process.ExitCode -ne 0 -or !(Test-Path 'smoke-result.json')) { throw 'EXE smoke test failed' }
          if (!(Get-Content smoke-result.json | ConvertFrom-Json).ok) { throw 'EXE smoke test did not pass' }
      - name: Build production installer
        shell: pwsh
        run: |
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' WatchAlign.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Package test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Recurse dist/WatchAlign artifact/WatchAlign-V1
          Copy-Item SETUP-NOTES.txt artifact/SETUP-NOTES.txt
          Copy-Item V1-README.md artifact/V1-README.md
          Compress-Archive -Path artifact/* -DestinationPath WatchAlign-V1-Windows.zip -Force
      - name: Upload Windows test artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-V1-Windows
          path: WatchAlign-V1-Windows.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish tested production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.2.0'
          git fetch --tags
          if (git tag -l $tag) { throw 'Release tag already exists; never overwrite a release' }
          Get-FileHash WatchAlign-V1-Windows.zip,installer_output/WatchAlignSetup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content SHA256SUMS.txt
          gh release create $tag WatchAlign-V1-Windows.zip installer_output/WatchAlignSetup.exe SHA256SUMS.txt --target $env:GITHUB_SHA --title 'Watch Align V1 1.2.0' --notes-file RELEASE-V1.2.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
