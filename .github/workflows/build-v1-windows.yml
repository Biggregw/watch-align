name: Build Watch Align V1 Windows

on:
  push:
    branches:
      - feature/v1-reference-aware-alignment-main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pystray pytest

      - name: Run V1 regression tests
        shell: pwsh
        run: |
          python -m pytest -q tests

      - name: Build Windows app
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm WatchAlign.spec

      - name: Smoke-check build output
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/WatchAlign/WatchAlign.exe')) {
            throw 'WatchAlign.exe was not produced.'
          }
          Get-ChildItem -Recurse dist/WatchAlign | Select-Object FullName,Length

      - name: Package test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Recurse dist/WatchAlign artifact/WatchAlign-V1
          Copy-Item SETUP-NOTES.txt artifact/SETUP-NOTES.txt
          Compress-Archive -Path artifact/* -DestinationPath WatchAlign-V1-Windows.zip -Force

      - name: Upload Windows test artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatchAlign-V1-Windows
          path: WatchAlign-V1-Windows.zip
          if-no-files-found: error
          retention-days: 14
