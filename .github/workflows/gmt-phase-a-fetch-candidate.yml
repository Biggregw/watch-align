name: GMT Phase A - fetch frontal candidate image

# Fetches the first-party Rolex catalogue candidate image for Phase A frontal
# landmark measurement (see docs/research/GMT_12_TRIANGLE_FRONTAL_MILESTONE.md)
# and uploads it as a build artifact for inspection. The interactive dev
# environment's network egress cannot reach media.rolex.com directly; this
# mirrors android/fetch_genuine_fixtures.py's proven-working CI fetch path.
# The image is never committed to the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch candidate image
        run: python3 tools/research/phase_a_fetch_candidate_image.py phase_a_candidates

      - name: Upload candidate image artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmt-phase-a-candidate-image
          path: phase_a_candidates/
          if-no-files-found: error
          retention-days: 7
