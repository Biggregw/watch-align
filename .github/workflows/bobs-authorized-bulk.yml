name: Research - Bob's authorised Watch Align intake

on:
  push:
    branches: [research/dropbox-inbox-acquisition-20261024]
    paths: [tools/research/bobs_authorized_bulk.trigger]

permissions:
  contents: read

concurrency:
  group: watchalign-bobs-research-intake
  cancel-in-progress: false

jobs:
  download-to-private-dropbox:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research intake dependencies
        run: python -m pip install -q 'requests>=2.32,<3' 'Pillow>=10,<12' 'beautifulsoup4>=4.12,<5'
      - name: Offline gallery and provenance isolation tests
        run: |
          python -m unittest discover -s tools/research/tests -p 'test_bobs_authorized_bulk.py' -v
          python -m unittest discover -s tools/research/tests -p 'test_dropbox_inbox_acquire.py' -v
      - name: Acquire 50 stock-identified watch galleries to private Dropbox staging
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.WATCHALIGN_DROPBOX_ACCESS_TOKEN }}
        run: |
          python tools/research/bobs_authorized_bulk.py --max-listings 50 --max-images-per-watch 12 --delay 0.6
