name: Research retrieve one genuine GMT photo (verified separately)
on:
  push:
    branches: [feature/android-alpha106-marker-mismatch-research]
    paths: ['.github/workflows/research-retrieve-genuine-126713grnr.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q requests pillow
      - name: Retrieve image using exact harvester user agent, audit SHA
        run: |
          mkdir -p research_photo
          python3 - <<'PY'
          import hashlib,pathlib,requests,io
          from PIL import Image
          u='https://content.thewosgroup.com/productimage/17305525/17305525_2.png?impolicy=hero-rolex'
          expected='b93685d799ec9f84922f15b567e62629577f8ff76b7c23b7087eb63a05128546'
          agent='WatchAlignDatasetHarvester/1.0 (+https://github.com/Biggregw/watch-align; research test set)'
          r=requests.get(u,timeout=25,headers={'User-Agent':agent})
          r.raise_for_status()
          data=r.content
          found=hashlib.sha256(data).hexdigest()
          im=Image.open(io.BytesIO(data))
          print('SHA256',found,'EXPECTED',expected,'MATCH',found==expected,'BYTES',len(data),'IMAGE',im.size)
          pathlib.Path('research_photo/126713GRNR_source_current.png').write_bytes(data)
          pathlib.Path('research_photo/source_audit.txt').write_text(
            f'Watch ID hv_page_b64df841ae; model 126713GRNR, gold-surround variant\n'
            f'Original SHA256 {expected}\n'
            f'Current SHA256 {found}\nExact original match: {found==expected}\n'
            f'Current URL {u}\nThe 6.61% score belongs to the ORIGINAL bytes, not automatically to the new retrieval.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: original-watch-listing-current-image-with-audit
          path: research_photo/
          retention-days: 7
