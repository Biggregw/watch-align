name: Research - reviewed Bob's production alignment audit

on:
  push:
    branches:
      - research/dropbox-inbox-acquisition-20261024
    paths:
      - tools/research/dropbox_49_measure.trigger

permissions:
  contents: read

concurrency:
  group: watchalign-reviewed49-offline-audit
  cancel-in-progress: false

jobs:
  offline-measure:
    strategy:
      fail-fast: false
      matrix:
        route: [submariner_124060, submariner_126610, gmt_126710]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install research downloader and image dependencies
        run: python -m pip install -q 'requests>=2.32,<3' 'Pillow>=10,<12'
      - name: Restore OpenCV desktop-harness dependency
        uses: actions/cache@v4
        with:
          path: tools/desktop-harness/.cache/opencv-4.9.0-0.jar
          key: opencv-4.9.0-0-jar
      - name: Verify research-only script syntax
        run: python -m py_compile tools/research/dropbox_49_production_audit.py
      - name: Measure reviewed originals through existing app pipeline and upload verified evidence
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.WATCHALIGN_DROPBOX_ACCESS_TOKEN }}
        run: |
          python -u tools/research/dropbox_49_production_audit.py --route '${{ matrix.route }}'
