name: Alpha90 Frozen Batch Validation

on:
  workflow_dispatch:
  push:
    branches:
      - test/alpha90-batch-validation
    paths:
      - 'android/alpha90_validation_cases.tsv'
      - 'android/fetch_alpha90_validation_fixtures.py'
      - 'android/app/src/androidTest/**'
      - '.github/workflows/alpha90-batch-validation.yml'

permissions:
  contents: read

jobs:
  alpha90-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove frozen production source is unchanged
        shell: bash
        run: |
          BASE=f66acee665a5afb4450fa08f61396c344be43627
          git diff --exit-code "$BASE" -- app/src/main
          echo "android/app/src/main is byte-for-byte unchanged from frozen Alpha90 source $BASE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare validation fixtures
        shell: bash
        run: |
          set +e
          python3 fetch_alpha90_validation_fixtures.py
          REDDIT_EXIT=$?
          set -e

          D=app/src/androidTest/assets/alpha90_validation
          IMAGE_COUNT=$(find "$D" -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | wc -l)
          echo "Direct Reddit fixture count: $IMAGE_COUNT (fetch exit $REDDIT_EXIT)"

          # GitHub-hosted runners are currently receiving HTTP 403 from Reddit JSON.
          # Keep the locked Reddit queue in the manifest, but prove the harness end-to-end
          # using the project's already-proven Imgur-backed 126710BLNR research sources.
          if [ "$IMAGE_COUNT" -eq 0 ]; then
            cd ..
            python3 -m pip install -q -r datasets/126710BLNR/requirements.txt
            python3 datasets/126710BLNR/fetch_images.py --clean \
              --source gen_wex_3KSuGhC \
              --source gen_wex_1TDYtpN \
              --source rep_vsf_7s6PyXJ \
              --source rep_vsf_p3hHVMB \
              --source rep_cf_bpdi5xV \
              --source rep_cf_6I00d8w || true

            D=android/app/src/androidTest/assets/alpha90_validation
            MAN="$D/runtime_manifest.tsv"
            # Preserve the locked-queue fetch failures already written by the Reddit fetcher.
            # Add known smoke controls with provenance and community notes from manifest.csv.
            copy_case () {
              SRC="$1"; DEST="$2"; CID="$3"; CLASS="$4"; TARGET="$5"; NOTE="$6"; THREAD="$7"
              if [ -s "$SRC" ]; then
                cp "$SRC" "$D/$DEST"
                printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
                  "$CID" "$CLASS" "$THREAD" "$TARGET" "$NOTE" "$DEST" "$SRC" "dataset_fallback" >> "$MAN"
              fi
            }

            copy_case datasets/126710BLNR/gen/calibration/gen_wex_3KSuGhC/image_00.jpg SMOKE_GEN1.jpg SMOKE_GEN1 GEN "genuine control" "source-labelled genuine candidate; calibration source" "1p0o3bp"
            copy_case datasets/126710BLNR/gen/validation/gen_wex_1TDYtpN/image_01.jpg SMOKE_GEN2.jpg SMOKE_GEN2 GEN "genuine control" "source-labelled genuine candidate; held-out validation source" "1s71mol"
            copy_case datasets/126710BLNR/rep/validation/rep_vsf_7s6PyXJ/image_02.jpg SMOKE_RL1.jpg SMOKE_RL1 RL "6 left / 12 slightly tilted" "community-noted local alignment deviations" "1u1h4ix"
            copy_case datasets/126710BLNR/rep/validation/rep_vsf_p3hHVMB/image_00.jpg SMOKE_BORDER1.jpg SMOKE_BORDER1 BORDERLINE "12 slightly CCW" "submitter described slight 12 counter-clockwise rotation" "1u91yef"
            copy_case datasets/126710BLNR/rep/calibration/rep_cf_bpdi5xV/image_00.jpg SMOKE_TEXT1.jpg SMOKE_TEXT1 RL "dial-font/text concern" "community thread ultimately recommended RL for unusual dial-font rendering" "u6er21"
            copy_case datasets/126710BLNR/rep/calibration/rep_cf_6I00d8w/image_01.jpg SMOKE_BEZEL1.jpg SMOKE_BEZEL1 BORDERLINE "bezel/colour-transition concern" "community thread noted possible bezel triangle and colour-transition alignment" "tfmfak"
            cd android
          fi

          echo "===== runtime fixture manifest ====="
          cat app/src/androidTest/assets/alpha90_validation/runtime_manifest.tsv
          echo "===== fetch warnings ====="
          cat app/src/androidTest/assets/alpha90_validation/fetch_errors.txt || true
          FINAL_COUNT=$(find app/src/androidTest/assets/alpha90_validation -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | wc -l)
          echo "Final fixture count: $FINAL_COUNT"
          test "$FINAL_COUNT" -gt 0

      - name: Permit x86_64 only for CI instrumentation APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          old="ndk { abiFilters 'arm64-v8a' }"
          new="ndk { abiFilters 'arm64-v8a', 'x86_64' }"
          if old not in s:
              raise SystemExit('expected Alpha90 ABI line not found')
          p.write_text(s.replace(old,new,1))
          PY
          grep "abiFilters" app/build.gradle

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run exact Alpha90 path over all fixtures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set +e
            cd android
            bash ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.watchalign.mobile.Alpha90BatchValidationTest \
              -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true \
              --stacktrace
            TEST_EXIT=$?
            mkdir -p alpha90-batch-out
            PKG=$(adb shell pm list packages | sed -n 's/package://p' | grep 'watchalign' | head -1 | tr -d '\r')
            echo "Installed package: $PKG"
            if [ -n "$PKG" ]; then
              adb exec-out run-as "$PKG" tar cf - files/alpha90-batch > alpha90-batch-out/alpha90-batch.tar
              tar xf alpha90-batch-out/alpha90-batch.tar -C alpha90-batch-out || true
              if [ -f alpha90-batch-out/files/alpha90-batch/results.csv ]; then
                echo "===== Alpha90 results ====="
                cat alpha90-batch-out/files/alpha90-batch/results.csv
              fi
            fi
            exit $TEST_EXIT

      - name: Upload Alpha90 review pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Alpha90-frozen-batch-validation
          path: |
            android/alpha90-batch-out/
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
            android/app/src/androidTest/assets/alpha90_validation/runtime_manifest.tsv
            android/app/src/androidTest/assets/alpha90_validation/fetch_errors.txt
          if-no-files-found: warn
          retention-days: 30
