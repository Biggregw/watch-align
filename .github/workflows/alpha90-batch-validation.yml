name: Alpha90 Frozen Batch Validation

on:
  workflow_dispatch:
  push:
    branches:
      - test/alpha90-batch-validation
    paths:
      - 'android/alpha90_validation_cases.tsv'
      - 'android/alpha90_test_pool.tsv'
      - 'android/fetch_alpha90_validation_fixtures.py'
      - 'android/prepare_alpha90_test_pool.py'
      - 'android/app/src/androidTest/**'
      - '.github/workflows/alpha90-batch-validation.yml'

permissions:
  contents: read

jobs:
  alpha90-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove frozen production source is unchanged
        shell: bash
        run: |
          BASE=f66acee665a5afb4450fa08f61396c344be43627
          git diff --exit-code "$BASE" -- app/src/main
          echo "android/app/src/main is byte-for-byte unchanged from frozen Alpha90 source $BASE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare locked queue and curated test pool
        shell: bash
        run: |
          # Keep attempting the original locked Reddit queue. GitHub runners currently
          # receive HTTP 403 from Reddit, so this is allowed to fail closed.
          set +e
          python3 fetch_alpha90_validation_fixtures.py
          REDDIT_EXIT=$?
          set -e
          echo "Locked Reddit fetch exit: $REDDIT_EXIT"

          # The reusable automated pool is provenance controlled in git but image bytes
          # stay external. Pull the selected Imgur-backed sources with the existing
          # dataset fetcher and copy only the explicitly selected images into androidTest.
          cd ..
          python3 -m pip install -q -r datasets/126710BLNR/requirements.txt
          cd android
          python3 prepare_alpha90_test_pool.py

          D=app/src/androidTest/assets/alpha90_validation
          POOL_COUNT=$(tail -n +2 alpha90_test_pool.tsv | grep -c .)
          CURATED_COUNT=$(find "$D" -maxdepth 1 -type f -name 'POOL_*.jpg' | wc -l)
          FINAL_COUNT=$(find "$D" -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | wc -l)

          echo "===== runtime fixture manifest ====="
          cat "$D/runtime_manifest.tsv"
          echo "===== locked-source fetch warnings ====="
          cat "$D/fetch_errors.txt" || true
          echo "===== curated-pool errors ====="
          cat "$D/curated_pool_errors.txt" || true
          echo "Curated pool: $CURATED_COUNT/$POOL_COUNT images"
          echo "Total runtime images: $FINAL_COUNT"

          test "$CURATED_COUNT" -eq "$POOL_COUNT"
          test "$FINAL_COUNT" -ge "$POOL_COUNT"

      - name: Permit x86_64 only for CI instrumentation APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          old="ndk { abiFilters 'arm64-v8a' }"
          new="ndk { abiFilters 'arm64-v8a', 'x86_64' }"
          if old not in s:
              raise SystemExit('expected Alpha90 ABI line not found')
          p.write_text(s.replace(old,new,1))
          PY
          grep "abiFilters" app/build.gradle

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run exact Alpha90 path over all fixtures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash -lc 'cd android; set +e; bash ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.watchalign.mobile.Alpha90BatchValidationTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace; TEST_EXIT=$?; mkdir -p alpha90-batch-out; PKG=com.watchalign.mobile.poc; echo "Installed package check: $PKG"; if adb shell pm path "$PKG" >/dev/null 2>&1; then adb exec-out run-as "$PKG" tar cf - files/alpha90-batch > alpha90-batch-out/alpha90-batch.tar; tar xf alpha90-batch-out/alpha90-batch.tar -C alpha90-batch-out || true; if [ -f alpha90-batch-out/files/alpha90-batch/results.csv ]; then echo "===== Alpha90 results ====="; cat alpha90-batch-out/files/alpha90-batch/results.csv; fi; fi; exit $TEST_EXIT'

      - name: Upload Alpha90 review pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Alpha90-frozen-batch-validation
          path: |
            android/alpha90-batch-out/
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
            android/app/src/androidTest/assets/alpha90_validation/runtime_manifest.tsv
            android/app/src/androidTest/assets/alpha90_validation/fetch_errors.txt
            android/app/src/androidTest/assets/alpha90_validation/curated_pool_errors.txt
          if-no-files-found: warn
          retention-days: 30
