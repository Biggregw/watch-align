name: Temporary Bob's 124060 image-pack transport

on:
  push:
    branches:
      - tmp/sub124060-extra-gen-pack
    paths:
      - '.github/workflows/sub124060-image-pack.yml'

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests pillow
      - name: Download the 48 manually reviewed Bob's Watches images
        run: |
          python3 - <<'PY'
          import csv, hashlib, os, requests
          from PIL import Image, ImageDraw
          from concurrent.futures import ThreadPoolExecutor, as_completed
          ITEMS=[["186406","zUsed-Rolex-Submariner-124060-186406.jpg"],["174149","zUsed-Rolex-Submariner-124060-SKU174149-Black-Dial.jpg"],["182482","zUsed-Rolex-Submariner-124060-SKU182482.jpg"],["190826","zUsed-Rolex-Submariner-124060-SKU190826.jpg"],["190837","zUsed-Rolex-Submariner-124060-SKU190837.jpg"],["192314","zUsed-Rolex-Submariner-124060-SKU192314.jpg"],["184467","zUsed-Rolex-Submariner-124060-SKU184467-PL.jpg"],["185013","zUsed-Rolex-Submariner-124060-Black-Dial-SKU185013.jpg"],["188850","zUsed-Rolex-Submariner-124060-SKU188850.jpg"],["186502","zUsed-Rolex-Submariner-124060-SKU186502.jpg"],["185570","zUsed-Rolex-Submariner-124060-SKU185570.jpg"],["187509","zPre-Owned-Rolex-Submariner-124060-SKU187509-Black-Dial.jpg"],["187191","zUsed-Rolex-Submariner-124060-Black-Dial-SKU187191-PL.jpg"],["190902","z190902-Used-Rolex-Submariner-124060-SKU190902.jpg"],["190126","zUsed-Rolex-Submariner-124060-SKU190126.jpg"],["191878","zUsed-Rolex-Submariner-124060-SKU191878.jpg"],["193105","zUsed-Rolex-Submariner-124060-SKU193105.jpg"],["188311","zUsed-Rolex-Submariner-124060-SKU188311.jpg"],["184502","zUsed-Rolex-Submariner-124060-SKU184502-PL.jpg"],["191304","z191304-Used-Rolex-Submariner-124060-SKU191304.jpg"],["185429","zUsed-Rolex-Submariner-124060-Black-Dial-SKU185429.jpg"],["185853","zUsed-Rolex-Submariner-124060-Black-Dial-SKU185853.jpg"],["182762","zUsed-Rolex-Submariner-124060-Black-Chromalight-Dial-SKU182762.jpg"],["189982","zUsed-Rolex-Submariner-124060-SKU189982.jpg"],["192468","zUsed-Rolex-Submariner-124060-SKU192468.jpg"],["194074","zUsed-Rolex-Submariner-124060-SKU194074PL.jpg"],["194034","zUsed-Rolex-Submariner-124060-SKU194034PL.jpg"],["187661","z187661-Used-Rolex-Submariner-124060-SKU187661-Black-Dial.jpg"],["189182","zUsed-Rolex-Submariner-124060-SKU189182.jpg"],["187178","zUsed-Rolex-Submariner-124060-SKU187178-PL.jpg"],["180527","zUsed-Rolex-Submariner-124060-SKU180527-PL.jpg"],["182386","zUsed-Rolex-Submariner-124060-Black-Chromalight-Dial-SKU182386PL.jpg"],["187194","zUsed-Rolex-Submariner-124060-Black-Dial-SKU187194-PL.jpg"],["187502","zUsed-Rolex-Submariner-124060-SKU187502-PL.jpg"],["189163","zUsed-Rolex-Submariner-124060-SKU189163.jpg"],["185595","zUsed-Rolex-Submariner-124060-Black-Dial-SKU185595.jpg"],["189885","z189885-Used-Master-Rolex-Submariner-124060-SKU189885.jpg"],["194063","zUsed-Rolex-Submariner-124060-SKU194063.jpg"],["193191","zUsed-Rolex-Submariner-124060-SKU193191.jpg"],["190835","zUsed-Rolex-Submariner-124060-SKU190835.jpg"],["190698","zUsed-Rolex-Submariner-124060-SKU190698.jpg"],["185878","zUsed-Rolex-Submariner-124060-SKU185878.jpg"],["159617","zUsed-Rolex-Submariner-124060-SKU159617.jpg"],["151200","zMens-Rolex-Submariner-124060-151200.jpg"],["191110","z191110-Used-Rolex-Submariner-124060-SKU191110.jpg"],["180726","zUsed-Rolex-Submariner-124060-Black-Dial-SKU180726.jpg"],["182626","zUsed-Rolex-Submariner-124060-SKU182626.jpg"],["182059","zUsed-Rolex-Submariner-124060-SKU182059.jpg"]]
          os.makedirs('pack/images',exist_ok=True)
          def get(item):
              sku,fn=item
              direct='https://www.bobswatches.com/images/'+fn
              cdn='https://www.bobswatches.com/cdn-cgi/image/width=768,quality=85,sharpen=0.5/images/'+fn
              headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.bobswatches.com/'}
              last=None
              for url in (direct,cdn):
                  try:
                      r=requests.get(url,headers=headers,timeout=25)
                      if r.status_code==200 and r.headers.get('content-type','').startswith('image/') and len(r.content)>30000:
                          p=f'pack/images/{sku}.jpg'
                          open(p,'wb').write(r.content)
                          with Image.open(p) as im:
                              w,h=im.size
                              if w<500 or h<500: raise ValueError(f'too small {w}x{h}')
                          return {'sku':sku,'file':f'{sku}.jpg','source':'Bob\'s Watches','image_url':url,
                                  'sha256':hashlib.sha256(r.content).hexdigest(),'width':w,'height':h}
                      last=f'{url} HTTP {r.status_code} {len(r.content)}'
                  except Exception as e: last=repr(e)
              raise RuntimeError(f'{sku}: {last}')
          rows=[]; errors=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
              futs={ex.submit(get,it):it for it in ITEMS}
              for fut in as_completed(futs):
                  try: rows.append(fut.result())
                  except Exception as e: errors.append(str(e))
          if errors:
              print('\n'.join(errors)); raise SystemExit(f'{len(errors)} downloads failed')
          rows.sort(key=lambda r:[x[0] for x in ITEMS].index(r['sku']))
          if len(rows)!=48: raise SystemExit(f'expected 48, got {len(rows)}')
          hashes=[r['sha256'] for r in rows]
          if len(set(hashes))!=48: raise SystemExit('duplicate image bytes detected')
          with open('pack/manifest.csv','w',newline='') as fh:
              w=csv.DictWriter(fh,fieldnames=rows[0].keys()); w.writeheader(); w.writerows(rows)
          with open('pack/README.txt','w') as fh:
              fh.write("48 genuine Rolex Submariner 124060 front/QC images from Bob's Watches.\n")
              fh.write("Each image was manually reviewed for a substantially face-on, useful dial view before this pack was built.\n")
              fh.write("Bob's listing pages identify these as Rolex 124060 and state that their pre-owned Rolex watches are guaranteed genuine/certified authentic.\n")
              fh.write("Use as an independent visual/QC test set; do not silently promote into calibration limits.\n")
          thumbs=[]
          for r in rows:
              im=Image.open('pack/images/'+r['file']).convert('RGB')
              im.thumbnail((300,300))
              c=Image.new('RGB',(320,340),'white'); c.paste(im,((320-im.width)//2,5+(300-im.height)//2))
              ImageDraw.Draw(c).text((10,315),'Bob '+r['sku'],fill='black'); thumbs.append(c)
          cols=6; nrows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*320,nrows*340),'white')
          for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*320,(i//cols)*340))
          sheet.save('pack/contact_sheet.jpg',quality=92)
          print('Built pack with',len(rows),'unique images')
          PY
      - name: Zip pack
        run: zip -q -r Rolex-124060-Bobs-48-QC-images.zip pack
      - uses: actions/upload-artifact@v4
        with:
          name: Rolex-124060-Bobs-48-QC-images
          retention-days: 3
          path: Rolex-124060-Bobs-48-QC-images.zip
