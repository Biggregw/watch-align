name: Build Batgirl genuine reference

on:
  push:
    branches:
      - research/batgirl-genuine-reference-2026-09-20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source fetch tools
        run: pip install --disable-pip-version-check gallery-dl pillow requests

      - name: Fetch fixed Batgirl source set
        run: |
          python tools/fetch_batgirl_reference_sources.py
          echo '--- source manifest ---'
          cat android/app/src/androidTest/assets/batgirl-reference/126710BLNR/sources.tsv

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run production-pose reference builder
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash android/gradlew -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.watchalign.mobile.GenuineBatgirlReferenceBuilderTest --stacktrace
            mkdir -p batgirl-reference-output
            adb pull /sdcard/Android/data/com.watchalign.mobile/files/batgirl-reference/. batgirl-reference-output/

      - name: Validate derived reference
        run: |
          test -s batgirl-reference-output/batgirl_genuine_edge_support.png
          test -s batgirl-reference-output/batgirl_genuine_edge_consensus.png
          test -s batgirl-reference-output/manifest.tsv
          grep -q $'official_rolex_2026\tofficial' batgirl-reference-output/manifest.tsv
          echo '--- selected source watches ---'
          cat batgirl-reference-output/manifest.tsv
          echo '--- output files ---'
          find batgirl-reference-output -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Upload canonical reference research artifact
        uses: actions/upload-artifact@v4
        with:
          name: batgirl-genuine-reference-research
          path: |
            batgirl-reference-output/
            android/app/src/androidTest/assets/batgirl-reference/126710BLNR/sources.tsv
          if-no-files-found: error
          retention-days: 14
