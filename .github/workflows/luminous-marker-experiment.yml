name: Experimental luminous marker validation
on:
  push:
    branches: [feature/luminous-marker-experiment]
    paths:
      - tools/luminous/**
      - tools/desktop-harness/drivers/Luminous*.java
      - android/app/src/main/java/com/watchalign/mobile/Luminous*.java
      - android/app/src/test/java/com/watchalign/mobile/Luminous*.java
      - .github/workflows/luminous-marker-experiment.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve existing measurement implementation
        run: |
          git diff --exit-code 593966433079d04816e98f78da5b66abd1f4553d -- android/app/src/main/assets/models android/app/src/main/java/com/watchalign/mobile/Alpha99Pipeline.java android/app/src/main/java/com/watchalign/mobile/Alpha94MarkerMeasurement.java android/app/src/main/java/com/watchalign/mobile/Alpha99Findings.java android/app/src/main/java/com/watchalign/mobile/ExpectedMarkerOutline.java android/app/src/main/java/com/watchalign/mobile/MarkerPolygonMismatch.java android/app/src/main/java/com/watchalign/mobile/MarkerMismatchOverlay.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==12.3.0
      - name: Android unit tests before photographic validation
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace
      - uses: actions/download-artifact@v4
        with:
          repository: Biggregw/watch-align
          run-id: '38222239457'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: WatchAlign-genuine-faceon-132-originals-Codex-ready
          path: curated-artifact
      - name: Verify curated originals and choose bounded disjoint subset
        run: |
          python tools/luminous/prepare_curated.py curated-artifact luminous-work .
          python tools/luminous/select_subset.py luminous-work
      - name: Measure development photographs only
        run: |
          for model in gmt_126710 submariner_124060 submariner_126610; do
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$model" bash tools/desktop-harness/run.sh LuminousValidation "luminous-work/${model}_development.csv" "luminous-work/$model/development"
          done
      - name: Derive provisional inner polygons from multiple genuine groups
        run: python tools/luminous/derive_references.py luminous-work
      - name: Validate held-out originals using frozen inner references
        run: |
          for model in gmt_126710 submariner_124060 submariner_126610; do
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$model" bash tools/desktop-harness/run.sh LuminousValidation "luminous-work/${model}_heldout.csv" "luminous-work/$model/heldout" score
          done
      - name: Publish bounded reference provenance and held-out evidence
        run: |
          python tools/luminous/publish_validation.py luminous-work docs/research/luminous-experiment-2026-10-12
          git add android/app/src/main/assets/experimental/luminous docs/research/luminous-experiment-2026-10-12
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add experimentally measured inner references and held-out evidence [skip ci]'
          git push origin HEAD:feature/luminous-marker-experiment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luminous-reference-validation
          path: |
            luminous-work/*/development/markers.csv
            luminous-work/*/heldout/
            android/app/build/test-results/
            android/app/src/main/assets/experimental/luminous/
            docs/research/luminous-experiment-2026-10-12/
          retention-days: 30
