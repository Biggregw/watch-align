name: Frozen luminous fit regression
on:
  push:
    branches: [feature/luminous-marker-experiment]
    paths:
      - tools/luminous/fix/**
      - tools/desktop-harness/drivers/Luminous*.java
      - android/app/src/main/java/com/watchalign/mobile/Luminous*.java
      - android/app/src/test/java/com/watchalign/mobile/Luminous*.java
      - .github/workflows/luminous-marker-experiment.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze outer implementation and BOTH reference collections
        run: |
          git diff --exit-code 593966433079d04816e98f78da5b66abd1f4553d -- android/app/src/main/assets/models android/app/src/main/java/com/watchalign/mobile/Alpha99Pipeline.java android/app/src/main/java/com/watchalign/mobile/Alpha94MarkerMeasurement.java android/app/src/main/java/com/watchalign/mobile/Alpha99Findings.java android/app/src/main/java/com/watchalign/mobile/ExpectedMarkerOutline.java android/app/src/main/java/com/watchalign/mobile/MarkerPolygonMismatch.java android/app/src/main/java/com/watchalign/mobile/MarkerMismatchOverlay.java
          git diff --exit-code b8acf22ce7b6afab768d89349a87d514a20b78c9 -- android/app/src/main/assets/experimental/luminous
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==12.3.0
      - name: Unit and native negative controls
        run: |
          cd android
          bash ./gradlew :app:testDebugUnitTest --stacktrace
          cd ..
          bash tools/desktop-harness/run.sh LuminousSyntheticChecks
      - uses: actions/download-artifact@v4
        with:
          repository: Biggregw/watch-align
          run-id: '38222239457'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: WatchAlign-genuine-faceon-132-originals-Codex-ready
          path: curated-artifact
      - name: Verify original hashes and reuse exact Alpha107 subset and saved baseline
        run: |
          python tools/luminous/prepare_curated.py curated-artifact luminous-work .
          python tools/luminous/fix/inputs.py luminous-work
          python tools/luminous/fix/baselines.py luminous-work
      - name: Measure with frozen references; no derivation or calibration
        run: |
          for model in gmt_126710 submariner_124060 submariner_126610; do
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$model" bash tools/desktop-harness/run.sh LuminousValidation "luminous-work/${model}_regression.csv" "luminous-work/after/$model" score --no-gallery
          done
      - name: Verify unchanged outer results and all previously usable physical outlines
        run: python tools/luminous/fix/compare.py luminous-work docs/research/luminous-fit-fix-2026-10-12
      - name: Render exact fitted, alignment-only and observed comparison polygons
        run: |
          for model in gmt_126710 submariner_124060 submariner_126610; do
            JAVA_TOOL_OPTIONS="-Dwatchalign.model=$model" bash tools/desktop-harness/run.sh LuminousValidation "luminous-work/${model}_recoveries.csv" "luminous-work/gallery/$model" score
          done
          python tools/luminous/fix/publish.py luminous-work docs/research/luminous-fit-fix-2026-10-12
      - name: Publish reports and derived evidence only
        run: |
          git add docs/research/luminous-fit-fix-2026-10-12
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish frozen luminous fit regression and recovered evidence [skip ci]'
          git push origin HEAD:feature/luminous-marker-experiment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luminous-fit-fix-validation
          path: |
            luminous-work/after/
            luminous-work/gallery/
            android/app/build/test-results/
            docs/research/luminous-fit-fix-2026-10-12/
          retention-days: 30
