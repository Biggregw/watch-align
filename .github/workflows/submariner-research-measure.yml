name: Submariner research measurement

# Research-only corpus measurement for issue #34. No production Android QC is changed and no
# GMT verdict thresholds or authenticity classifier are used. Third-party image bytes stay in cache.
on:
  push:
    branches:
      - feature/submariner-family-harvester

permissions:
  contents: read

concurrency:
  group: submariner-research-measurement
  cancel-in-progress: false

jobs:
  measure:
    if: github.event.head_commit.message == 'Run Submariner research measurement'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install harvester and measurement dependencies
        run: python -m pip install -q -r tools/dataset_harvester/requirements.txt

      - name: Run deterministic tests
        run: python -m unittest discover -s tools/dataset_harvester/tests

      - name: Restore Submariner image cache
        uses: actions/cache@v4
        with:
          path: datasets/submariner_research/images
          key: submariner-measure-images-${{ github.run_id }}
          restore-keys: |
            submariner-source-images-
            submariner-measure-images-

      - name: Rebuild acquisition manifest and fill cache gaps
        run: |
          python3 tools/dataset_harvester/submariner_acquire.py \
            --pool docs/research/submariner_candidate_sources_2026-09-30.csv \
            --out datasets/submariner_research \
            --max-images 12 | tee submariner-acquisition-for-measurement.log

      - name: Measure unique Submariner images
        run: |
          python3 tools/dataset_harvester/submariner_measure.py \
            --root datasets/submariner_research \
            --manifest datasets/submariner_research/acquired_images.csv \
            --out datasets/submariner_research/measurements | tee submariner-measurement.log

      - name: Summarise measurement
        if: always()
        run: |
          if [ -f datasets/submariner_research/measurements/submariner_measurement_report.json ]; then
            cat datasets/submariner_research/measurements/submariner_measurement_report.json
            echo '## Submariner research measurement' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat datasets/submariner_research/measurements/submariner_measurement_report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload measurement manifests and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submariner-research-measurement-${{ github.run_id }}
          path: |
            datasets/submariner_research/acquired_images.csv
            datasets/submariner_research/candidate_summary.csv
            datasets/submariner_research/measurements/submariner_image_measurements.csv
            datasets/submariner_research/measurements/submariner_marker_measurements.csv
            datasets/submariner_research/measurements/submariner_watch_repeatability.csv
            datasets/submariner_research/measurements/submariner_measurement_report.json
            submariner-acquisition-for-measurement.log
            submariner-measurement.log
          if-no-files-found: warn
