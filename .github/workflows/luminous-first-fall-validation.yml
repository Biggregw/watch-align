# VALIDATION ONLY, one bounded cycle. Experimental first-significant-fall circular luminous boundary selection
# (this branch, based on e0b0b651) against the unchanged candidate (e0b0b651: same tree with only
# LuminousCircularBoundary.java restored) and the frozen calibration fits, on all 46 genuine 124060 originals
# (existing artifacts: originals run 38222239457, frozen calibration work run 38295283386). No reference,
# calibration, threshold, area-denominator or noncircular change; no APK. Images go to the log of a second job only.
name: Luminous first-fall validation (124060)
on:
  push:
    branches: [exp/luminous-first-fall-20261013]
    paths: ['.github/workflows/luminous-first-fall-validation.yml', 'tools/luminous/diagnostic/**', 'android/app/src/main/java/com/watchalign/mobile/LuminousCircularBoundary.java']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q pillow==12.3.0 numpy matplotlib
      - name: Existing originals (run 38222239457)
        uses: actions/download-artifact@v4
        with: {name: WatchAlign-genuine-faceon-132-originals-Codex-ready, path: art/originals, run-id: 38222239457, github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Existing frozen calibration work (run 38295283386)
        uses: actions/download-artifact@v4
        with: {name: luminous-partial-calibration-reproducible-results, path: art/calib, run-id: 38295283386, github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Unit tests (luminous) and both class trees
        run: |
          SAVED=$(dirname "$(find art/calib -name calibrated_references.json | head -1)"); echo "SAVED=$SAVED" >> $GITHUB_ENV
          mkdir -p work
          python tools/luminous/prepare_curated.py art/originals work . > work/hash-verification.log; tail -2 work/hash-verification.log
          bash tools/desktop-harness/run.sh LuminousSyntheticChecks > /dev/null
          H=tools/desktop-harness; JAR=$H/.cache/opencv-4.9.0-0.jar
          cp -r $H/.cache/classes work/cls_exp
          rm -rf work/cand_src && cp -r android/app/src/main/java work/cand_src
          git show e0b0b6511d9f680c2619d50801909dfaa01f1914:android/app/src/main/java/com/watchalign/mobile/LuminousCircularBoundary.java > work/cand_src/com/watchalign/mobile/LuminousCircularBoundary.java
          git diff --no-index --stat work/cand_src android/app/src/main/java || true
          mkdir -p work/cls_cand && javac -encoding UTF-8 -nowarn -cp "$JAR" -sourcepath "$H/shim:work/cand_src:$H/drivers" -d work/cls_cand $H/drivers/*.java
          J4=$(find ~/.gradle ~/.m2 -name 'junit-4.13*.jar' 2>/dev/null | head -1)
          if [ -z "$J4" ]; then mkdir -p work/lib; curl -fsSL -o work/lib/junit.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar; curl -fsSL -o work/lib/hamcrest.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar; J4=work/lib/junit.jar:work/lib/hamcrest.jar; fi
          T=android/app/src/test/java/com/watchalign/mobile; mkdir -p work/ut
          javac -encoding UTF-8 -nowarn -cp "$JAR:$J4" -sourcepath "$H/shim:android/app/src/main/java:android/app/src/test/java" -d work/ut $T/Luminous*Test.java
          (cd android/app && java -cp "$GITHUB_WORKSPACE/$JAR:$J4:$GITHUB_WORKSPACE/work/ut" org.junit.runner.JUnitCore $(cd src/test/java/com/watchalign/mobile; ls Luminous*Test.java | sed 's/.java//; s/^/com.watchalign.mobile./')) | tail -4
          echo "JAR=$JAR" >> $GITHUB_ENV
      - name: Candidate and experimental detectors on the 46 genuine 124060 originals
        run: |
          python - <<'PY'
          import csv, os
          saved = os.environ['SAVED']
          paths = {r['photo_id']: r['path'] for r in csv.DictReader(open('work/verified_inputs.csv'))}
          rows = list(csv.DictReader(open(f'{saved}/submariner_124060_extract.csv')))
          for r in rows: r['path'] = paths[r['photo_id']]
          with open('work/m124060.csv', 'w', newline='') as f:
              w = csv.DictWriter(f, fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          with open('work/m124060_gallery.csv', 'w', newline='') as f:
              w = csv.writer(f); w.writerow(['photo_id', 'group_id', 'split', 'path'])
              for r in rows: w.writerow([r['photo_id'], r.get('group_id', ''), r.get('split', ''), r['path']])
          print('124060 photos', len(rows))
          PY
          for v in cand exp; do
            J="java -Xmx2g -Dwatchalign.model=submariner_124060 -cp $JAR:work/cls_$v com.watchalign.mobile.LuminousCalibrationStudy"
            $J extract work/m124060.csv work/${v}_raw.jsonl 2> work/${v}_extract.log &
          done; wait
          for v in cand exp; do
            java -Xmx2g -Dwatchalign.model=submariner_124060 -cp $JAR:work/cls_$v com.watchalign.mobile.LuminousCalibrationStudy score work/${v}_raw.jsonl "$SAVED/calibrated_references.json" work/${v}_scored.jsonl
          done
          wc -l work/*_raw.jsonl work/*_scored.jsonl
      - name: Exact rectified crops of every round marker (archived pose)
        run: |
          mkdir -p work/ev
          python - <<'PY' > work/ev_jobs.txt
          import csv
          for r in csv.DictReader(open('work/m124060.csv')):
              for h in (1, 2, 4, 5, 7, 8, 10, 11): print(r['path'], r['photo_id'], h)
          PY
          export CP=$JAR:work/cls_exp
          cat work/ev_jobs.txt | xargs -P 4 -L 1 sh -c 'java -Xmx1g -Dwatchalign.model=submariner_124060 -cp "$CP" com.watchalign.mobile.LuminousCircleEvidence "$0" work/exp_raw.jsonl "$1" "$2" work/ev 2>>work/ev.log || echo "evidence failed $1 $2"'
          ls work/ev/*.json | wc -l
      - name: Analysis
        run: |
          mkdir -p work/out
          python tools/luminous/diagnostic/first_fall_validation.py "$SAVED/submariner_124060_scored.jsonl" work/cand_scored.jsonl work/exp_scored.jsonl "$SAVED/calibrated_references.json" work/ev work/out > work/out/summary.txt
          grep -v '^ROW' work/out/summary.txt
      - name: Close-ups (experimental for every reviewed case; candidate for controls)
        run: |
          java -Xmx2g -Dwatchalign.model=submariner_124060 -Dwatchalign.study.stage=EXPERIMENTAL -cp "$JAR:work/cls_exp" com.watchalign.mobile.LuminousCalibrationStudy gallery work/exp_scored.jsonl work/m124060_gallery.csv work/out/select.csv work/out/exp 2> /dev/null
          java -Xmx2g -Dwatchalign.model=submariner_124060 -Dwatchalign.study.stage=CANDIDATE -cp "$JAR:work/cls_cand" com.watchalign.mobile.LuminousCalibrationStudy gallery work/cand_scored.jsonl work/m124060_gallery.csv work/out/select_controls.csv work/out/cand 2> /dev/null
          ls work/out/exp | wc -l; ls work/out/cand | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: luminous-first-fall-validation-124060
          retention-days: 30
          path: |
            work/out/
            work/exp_scored.jsonl
            work/cand_scored.jsonl
      - name: Summary (repeated last for the log tail)
        run: grep -v '^ROW' work/out/summary.txt
  images:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q pillow==12.3.0
      - uses: actions/download-artifact@v4
        with: {name: luminous-first-fall-validation-124060, path: v}
      - name: Images (JPEG, base64, log only)
        run: |
          python - <<'PY'
          import base64, io
          from pathlib import Path
          from PIL import Image
          root = next(Path('v').rglob('summary.txt')).parent
          files = sorted(root.glob('exp/*.png')) + sorted(root.glob('cand/*.png')) + sorted(root.glob('profile_*.png'))
          for f in files:
              im = Image.open(f).convert('RGB')
              if im.width > 1700: im = im.resize((1600, round(im.height * 1600 / im.width)))
              b = io.BytesIO(); im.save(b, 'JPEG', quality=82)
              print(f'BEGIN_IMG {f.parent.name}__{f.stem}.jpg'); print(base64.b64encode(b.getvalue()).decode()); print('END_IMG')
          print('IMAGES', len(files))
          PY
